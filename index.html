<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>BHAICHARA — 6 Player Partner Ludo</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  margin:0;width:100%;height:100%;overflow:hidden;
  background:
    radial-gradient(circle at 50% 45%,#173b4d 0,#07151f 48%,#02070b 100%);
  font-family:Arial,sans-serif;
}
body{display:flex;align-items:center;justify-content:center}
#game{
  position:relative;
  width:min(100vw,100vh);
  height:min(100vw,100vh);
}
svg{width:100%;height:100%;display:block}
.logo{
  position:absolute;z-index:20;top:5px;left:18px;
  color:white;font-weight:1000;font-size:clamp(18px,4vw,31px);
  letter-spacing:3px;text-shadow:0 4px 9px #000;
}
.online{
  position:absolute;right:16px;top:8px;z-index:20;
  color:#58ffab;border:1px solid #48ff9d;border-radius:20px;
  padding:6px 13px;background:#03110ddd;font-size:11px;font-weight:900;
}
.online i{
  display:inline-block;width:7px;height:7px;border-radius:50%;
  background:#4aff9e;box-shadow:0 0 9px #4aff9e;margin-right:5px;
}
.turn{
  position:absolute;bottom:6px;left:50%;transform:translateX(-50%);
  z-index:30;color:#fff;background:#020a11e8;
  border:1px solid #ffffff35;border-radius:22px;
  padding:8px 17px;font-size:12px;font-weight:bold;white-space:nowrap;
}
.notice{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  z-index:50;background:#02080eeF;border:1px solid #ffffff44;
  border-radius:15px;padding:12px 22px;color:white;font-weight:900;
  opacity:0;pointer-events:none;transition:.2s;
}
.notice.show{opacity:1}
.token{cursor:pointer}
.selectable{animation:pulse .65s infinite alternate}
@keyframes pulse{
  from{filter:drop-shadow(0 0 2px white)}
  to{filter:drop-shadow(0 0 15px white)}
}
</style>
</head>

<body>

<div id="game">

<div class="logo">BHAICHARA</div>
<div class="online"><i></i>ONLINE</div>

<svg viewBox="0 0 1000 1000">

<defs>

<!-- GOLD -->
<linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#70420b"/>
  <stop offset=".28" stop-color="#d89b28"/>
  <stop offset=".5" stop-color="#ffe88b"/>
  <stop offset=".72" stop-color="#d18c19"/>
  <stop offset="1" stop-color="#70420b"/>
</linearGradient>

<!-- TOKENS -->
<radialGradient id="blue">
  <stop offset="0" stop-color="#75d1ff"/>
  <stop offset=".55" stop-color="#168bea"/>
  <stop offset="1" stop-color="#034779"/>
</radialGradient>

<radialGradient id="yellow">
  <stop offset="0" stop-color="#fff87b"/>
  <stop offset=".55" stop-color="#efc500"/>
  <stop offset="1" stop-color="#856000"/>
</radialGradient>

<radialGradient id="purple">
  <stop offset="0" stop-color="#e9a3ff"/>
  <stop offset=".55" stop-color="#9135c8"/>
  <stop offset="1" stop-color="#48106a"/>
</radialGradient>

<radialGradient id="red">
  <stop offset="0" stop-color="#ff8585"/>
  <stop offset=".55" stop-color="#df3030"/>
  <stop offset="1" stop-color="#720f0f"/>
</radialGradient>

<radialGradient id="green">
  <stop offset="0" stop-color="#82ffb0"/>
  <stop offset=".55" stop-color="#18aa59"/>
  <stop offset="1" stop-color="#07592c"/>
</radialGradient>

<radialGradient id="orange">
  <stop offset="0" stop-color="#ffc77f"/>
  <stop offset=".55" stop-color="#ef7418"/>
  <stop offset="1" stop-color="#853300"/>
</radialGradient>

<filter id="shadow">
  <feDropShadow dx="0" dy="10" stdDeviation="9"
  flood-color="#000" flood-opacity=".72"/>
</filter>

<filter id="tokenShadow">
  <feDropShadow dx="0" dy="4" stdDeviation="3"
  flood-color="#000" flood-opacity=".75"/>
</filter>

</defs>

<!-- ================= BOARD ================= -->

<circle cx="500" cy="500" r="468"
 fill="#030b12" stroke="url(#gold)" stroke-width="20"
 filter="url(#shadow)"/>

<circle cx="500" cy="500" r="442"
 fill="#0a2636" stroke="#35566a" stroke-width="5"/>

<circle cx="500" cy="500" r="414"
 fill="none" stroke="#06131c" stroke-width="32"/>

<!-- HOMES -->
<g id="homes"></g>

<!-- WIDE TRACK BASE -->
<circle cx="500" cy="500" r="337"
 fill="none" stroke="#06131d" stroke-width="104"/>

<circle cx="500" cy="500" r="337"
 fill="none" stroke="#263f4d" stroke-width="4"/>

<!-- TRACK CELLS -->
<g id="track"></g>

<!-- HOME LANES -->
<g id="lanes"></g>

<!-- STARS + ARROWS -->
<g id="markers"></g>

<!-- ================= CENTER ================= -->

<polygon
 points="500,355 630,430 630,570 500,645 370,570 370,430"
 fill="#02080e"
 stroke="url(#gold)" stroke-width="12"
 filter="url(#shadow)"/>

<polygon
 points="500,385 600,443 600,557 500,615 400,557 400,443"
 fill="#116fc7"
 stroke="#81d5ff" stroke-width="4"/>

<polygon
 points="500,410 575,453 575,547 500,590 425,547 425,453"
 fill="#187ed8"
 stroke="#b5e6ff" stroke-width="2"/>

<!-- 3D DICE -->
<g id="dice" transform="translate(500 500)">

  <polygon
    points="0,-55 48,-27 48,27 0,55 -48,27 -48,-27"
    fill="#f7faff"
    stroke="#d9e7f0"
    stroke-width="4"
    filter="url(#tokenShadow)"/>

  <polygon
    points="0,-55 48,-27 0,0 -48,-27"
    fill="#ffffff"/>

  <polygon
    points="0,0 48,-27 48,27 0,55"
    fill="#dce7ef"/>

  <polygon
    points="-48,-27 0,0 0,55 -48,27"
    fill="#c7d5df"/>

  <g id="pips"></g>
</g>

<!-- TOKENS -->
<g id="tokens"></g>

</svg>

<div id="notice" class="notice"></div>
<div id="turn" class="turn">P1 की बारी • Dice दबाएँ</div>

</div>

<script>

/* =========================================================
   BHAICHARA V3
   ========================================================= */

const NS="http://www.w3.org/2000/svg";

const homes=document.getElementById("homes");
const track=document.getElementById("track");
const lanes=document.getElementById("lanes");
const markers=document.getElementById("markers");
const tokensLayer=document.getElementById("tokens");
const pips=document.getElementById("pips");
const dice=document.getElementById("dice");
const turnBox=document.getElementById("turn");
const notice=document.getElementById("notice");

const CX=500,CY=500;
const CELLS=72;
const PATH_R=337;

const players=[
 {id:0,name:"P1",color:"#168bea",grad:"url(#blue)",team:0},
 {id:1,name:"P2",color:"#efc800",grad:"url(#yellow)",team:1},
 {id:2,name:"P3",color:"#8d32c5",grad:"url(#purple)",team:2},
 {id:3,name:"P4",color:"#dc3030",grad:"url(#red)",team:0},
 {id:4,name:"P5",color:"#18a95a",grad:"url(#green)",team:1},
 {id:5,name:"P6",color:"#ef7418",grad:"url(#orange)",team:2}
];

const partner={0:3,3:0,1:4,4:1,2:5,5:2};

/*
 Reference layout:
 P4 top-left
 P5 top-right
 P6 right
 P1 bottom-right
 P2 bottom-left
 P3 left
*/
const homeAngles=[-30,210,150,330,30,90];

/* actual circular start points */
const starts=[0,12,24,36,48,60];

/* --------------------------------------------------------- */

function el(tag,attrs={}){
  const e=document.createElementNS(NS,tag);
  Object.keys(attrs).forEach(k=>e.setAttribute(k,attrs[k]));
  return e;
}

function polar(r,a){
  const rad=(a-90)*Math.PI/180;
  return [
    CX+r*Math.cos(rad),
    CY+r*Math.sin(rad)
  ];
}

function point(index){
  index=((index%CELLS)+CELLS)%CELLS;
  return polar(PATH_R,index*360/CELLS);
}

/* =========================================================
   HOME ZONES
   ========================================================= */

players.forEach((p,i)=>{

  const a=homeAngles[i];

  const left=polar(430,a-26);
  const right=polar(430,a+26);

  const home=el("polygon",{
    points:
      `${CX},${CY} ${left[0]},${left[1]} ${right[0]},${right[1]}`,
    fill:p.color,
    opacity:.88,
    stroke:"#06131d",
    "stroke-width":7
  });

  homes.appendChild(home);

  /* raised inner panel */

  const c=polar(382,a);

  const panel=el("circle",{
    cx:c[0],
    cy:c[1],
    r:73,
    fill:"#03101a",
    stroke:"#ffffff35",
    "stroke-width":4,
    filter:"url(#tokenShadow)"
  });

  homes.appendChild(panel);

  const label=el("text",{
    x:c[0],
    y:c[1]-94,
    fill:"#fff",
    "font-size":22,
    "font-weight":900,
    "text-anchor":"middle"
  });

  label.textContent=p.name;
  homes.appendChild(label);
});

/* =========================================================
   TRACK
   ========================================================= */

for(let i=0;i<CELLS;i++){

  const [x,y]=point(i);
  const owner=starts.indexOf(i);

  const cell=el("rect",{
    x:x-18,
    y:y-18,
    width:36,
    height:36,
    rx:6,
    fill:owner>=0 ? players[owner].color : "#eef4f7",
    stroke:"#172a35",
    "stroke-width":2
  });

  track.appendChild(cell);

  /* inner highlight */

  if(owner<0){

    const hi=el("rect",{
      x:x-14,
      y:y-14,
      width:28,
      height:8,
      rx:3,
      fill:"#fff",
      opacity:.35,
      "pointer-events":"none"
    });

    track.appendChild(hi);
  }
}

/* =========================================================
   HOME LANES
   ========================================================= */

players.forEach((p,i)=>{

  const angle=homeAngles[i];

  for(let n=0;n<6;n++){

    const pos=polar(282-n*29,angle);

    const cell=el("rect",{
      x:pos[0]-17,
      y:pos[1]-17,
      width:34,
      height:34,
      rx:6,
      fill:p.color,
      opacity:.95,
      stroke:"#101d25",
      "stroke-width":2
    });

    lanes.appendChild(cell);
  }
});

/* =========================================================
   SAFE STARS — EXACTLY 12
   ========================================================= */

const safe=[];

for(let i=0;i<6;i++){
  safe.push(starts[i]);
  safe.push((starts[i]+6)%CELLS);
}

safe.forEach((index,i)=>{

  const [x,y]=point(index);

  const star=el("text",{
    x:x,
    y:y+8,
    fill:"#ffd84b",
    "font-size":26,
    "font-weight":900,
    "text-anchor":"middle",
    "pointer-events":"none"
  });

  star.textContent="★";
  markers.appendChild(star);
});

/* =========================================================
   DIRECTION ARROWS
   ========================================================= */

for(let i=0;i<6;i++){

  const index=(starts[i]+10)%CELLS;
  const [x,y]=point(index);

  const arrow=el("text",{
    x:x,
    y:y+7,
    fill:players[i].color,
    "font-size":22,
    "font-weight":900,
    "text-anchor":"middle",
    "pointer-events":"none"
  });

  arrow.textContent="➜";
  arrow.setAttribute(
    "transform",
    `rotate(${index*5} ${x} ${y})`
  );

  markers.appendChild(arrow);
}

/* =========================================================
   HOME TOKEN POSITIONS
   ========================================================= */

const homePositions={};

players.forEach((p,i)=>{

  const c=polar(382,homeAngles[i]);

  homePositions[p.id]=[
    [c[0]-29,c[1]-29],
    [c[0]+29,c[1]-29],
    [c[0]-29,c[1]+29],
    [c[0]+29,c[1]+29]
  ];
});

/* =========================================================
   TOKENS
   ========================================================= */

const tokens=[];

for(let p=0;p<6;p++){
  for(let n=0;n<4;n++){

    tokens.push({
      id:p+"-"+n,
      player:p,
      number:n,
      progress:-1,
      finished:false,
      node:null
    });
  }
}

function globalPos(t){

  if(t.progress<0 || t.progress>=72)return null;

  return (starts[t.player]+t.progress)%CELLS;
}

function tokenPos(t){

  if(t.progress===-1){
    return homePositions[t.player][t.number];
  }

  if(t.progress>=72){

    const angle=homeAngles[t.player];
    const lane=t.progress-72;

    return polar(282-lane*29,angle);
  }

  return point(globalPos(t));
}

/* =========================================================
   DRAW TOKENS
   ========================================================= */

function drawTokens(){

  tokensLayer.innerHTML="";

  tokens.forEach(t=>{

    const p=players[t.player];
    const [x,y]=tokenPos(t);

    const g=el("g",{
      class:"token",
      transform:`translate(${x},${y})`
    });

    if(selectable(t))g.classList.add("selectable");

    /* shadow */

    g.appendChild(el("ellipse",{
      cx:3,cy:7,rx:16,ry:9,
      fill:"#000",opacity:.5
    }));

    /* lower body */

    g.appendChild(el("circle",{
      cx:0,cy:2,r:15,
      fill:"#07131b",
      opacity:.9
    }));

    /* main ring token */

    g.appendChild(el("circle",{
      cx:0,cy:0,r:15,
      fill:p.grad,
      stroke:"#06121a",
      "stroke-width":2
    }));

    /* ring */

    g.appendChild(el("circle",{
      cx:0,cy:0,r:10,
      fill:"none",
      stroke:"#fff",
      "stroke-width":2,
      opacity:.8
    }));

    /* center */

    g.appendChild(el("circle",{
      cx:0,cy:0,r:5,
      fill:p.color,
      opacity:.9
    }));

    /* shine */

    g.appendChild(el("ellipse",{
      cx:-5,cy:-7,rx:4,ry:2.5,
      fill:"#fff",
      opacity:.65,
      transform:"rotate(-25 -5 -7)"
    }));

    g.addEventListener("click",()=>{
      if(selectable(t))moveToken(t);
    });

    tokensLayer.appendChild(g);
    t.node=g;
  });
}

/* =========================================================
   GAME STATE
   ========================================================= */

let currentPlayer=0;
let diceValue=0;
let rolling=false;

function ownFinished(player){

  return tokens.filter(t=>
    t.player===player && t.finished
  ).length===4;
}

function teamFinished(team){

  return tokens.filter(t=>
    players[t.player].team===team && t.finished
  ).length===8;
}

function controllable(player){

  const list=[player];

  /* own 4 home होने के बाद partner unlock */
  if(ownFinished(player)){
    list.push(partner[player]);
  }

  return list;
}

function canMove(t,roll){

  if(t.finished)return false;

  if(t.progress===-1){
    return roll===6;
  }

  return t.progress+roll<=78;
}

function selectable(t){

  if(rolling || diceValue===0)return false;

  if(!controllable(currentPlayer).includes(t.player))
    return false;

  return canMove(t,diceValue);
}

/* =========================================================
   DICE
   ========================================================= */

function showDice(n){

  pips.innerHTML="";

  const patterns={
    1:[[0,0]],
    2:[[-18,-18],[18,18]],
    3:[[-18,-18],[0,0],[18,18]],
    4:[[-18,-18],[18,-18],[-18,18],[18,18]],
    5:[[-18,-18],[18,-18],[0,0],[-18,18],[18,18]],
    6:[[-18,-20],[18,-20],[-18,0],[18,0],[-18,20],[18,20]]
  };

  patterns[n].forEach(([x,y])=>{

    pips.appendChild(el("circle",{
      cx:x,cy:y,r:6,
      fill:"#c91414",
      stroke:"#8d0909",
      "stroke-width":1
    }));
  });
}

showDice(1);

/* =========================================================
   DICE ROLL
   ========================================================= */

dice.addEventListener("click",rollDice);

function rollDice(){

  if(rolling || diceValue!==0)return;

  rolling=true;

  let count=0;

  const timer=setInterval(()=>{

    showDice(1+Math.floor(Math.random()*6));

    count++;

    if(count>=10){

      clearInterval(timer);

      diceValue=1+Math.floor(Math.random()*6);

      showDice(diceValue);

      rolling=false;

      afterRoll();
    }

  },75);
}

/* =========================================================
   AFTER ROLL
   ========================================================= */

function afterRoll(){

  drawTokens();

  const possible=tokens.some(t=>selectable(t));

  if(!possible){

    message(
      diceValue===6
      ?"6 आया • कोई चाल नहीं"
      :"कोई चाल नहीं"
    );

    setTimeout(()=>{

      if(diceValue===6){

        diceValue=0;
        updateTurn();

      }else{

        nextTurn();
      }

    },800);

    return;
  }

  updateTurn(
    diceValue===6
    ?"6 आया • Token चुनें"
    :"Token चुनें"
  );
}

/* =========================================================
   MOVE
   ========================================================= */

function moveToken(t){

  const roll=diceValue;

  if(!canMove(t,roll))return;

  if(t.progress===-1){
    t.progress=0;
  }else{
    t.progress+=roll;
  }

  if(t.progress===78){
    t.finished=true;
  }

  capture(t);

  drawTokens();

  diceValue=0;

  if(teamFinished(players[currentPlayer].team)){

    message("🏆 TEAM "+(players[currentPlayer].team+1)+" WINS");

    updateTurn("🏆 Team जीत गई");

    return;
  }

  if(roll===6){

    message("6! फिर से चाल");

    setTimeout(()=>{
      hideMessage();
      updateTurn();
    },650);

  }else{

    nextTurn();
  }
}

/* =========================================================
   CAPTURE
   ========================================================= */

function capture(moved){

  const pos=globalPos(moved);

  if(pos===null)return;

  if(safe.includes(pos))return;

  tokens.forEach(other=>{

    if(other===moved)return;
    if(other.finished)return;
    if(other.progress<0 || other.progress>=72)return;

    /* same team cannot capture */
    if(
      players[other.player].team===
      players[moved.player].team
    )return;

    if(globalPos(other)===pos){

      other.progress=-1;
      other.finished=false;

      message("⚡ Token कट गया!");
    }
  });
}

/* =========================================================
   TURN
   ========================================================= */

function nextTurn(){

  diceValue=0;

  currentPlayer=(currentPlayer+1)%6;

  drawTokens();
  updateTurn();
}

function updateTurn(custom){

  const p=players[currentPlayer];

  let text=custom || p.name+" की बारी • Dice दबाएँ";

  if(ownFinished(currentPlayer)){

    text+=" • Partner "+
      players[partner[currentPlayer]].name+
      " unlocked";
  }

  turnBox.textContent=text;
}

/* =========================================================
   MESSAGE
   ========================================================= */

let noticeTimer;

function message(text){

  notice.textContent=text;
  notice.classList.add("show");

  clearTimeout(noticeTimer);

  noticeTimer=setTimeout(hideMessage,900);
}

function hideMessage(){
  notice.classList.remove("show");
}

/* =========================================================
   START
   ========================================================= */

drawTokens();
updateTurn();

/* RESET */
window.BHAICHARA_RESET=function(){

  tokens.forEach(t=>{
    t.progress=-1;
    t.finished=false;
  });

  currentPlayer=0;
  diceValue=0;

  showDice(1);
  drawTokens();
  updateTurn();
};

</script>

</body>
</html>
