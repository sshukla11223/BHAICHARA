<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>BHAICHARA</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#02070d;
  font-family:Arial,sans-serif;
}

#game{
  position:relative;
  width:100vw;
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}

canvas{
  display:block;
  width:min(100vw,100vh);
  height:min(100vw,100vh);
}

.logo{
  position:absolute;
  top:12px;
  left:18px;
  z-index:5;
  color:white;
  font-size:clamp(20px,4vw,34px);
  font-weight:900;
  letter-spacing:3px;
  text-shadow:0 3px 10px #000;
}

.online{
  position:absolute;
  right:15px;
  top:13px;
  z-index:5;
  color:#48ff9b;
  border:1px solid #48ff9b;
  border-radius:30px;
  padding:7px 14px;
  background:#06130de8;
  font-size:12px;
  font-weight:bold;
}

.dot{
  display:inline-block;
  width:7px;
  height:7px;
  background:#48ff9b;
  border-radius:50%;
  margin-right:5px;
  box-shadow:0 0 9px #48ff9b;
}

.info{
  position:absolute;
  bottom:10px;
  left:50%;
  transform:translateX(-50%);
  z-index:5;
  color:#fff;
  background:#050b11e8;
  border:1px solid #ffffff30;
  border-radius:20px;
  padding:8px 17px;
  font-size:12px;
  font-weight:bold;
  white-space:nowrap;
}
</style>
</head>

<body>

<div id="game">

<canvas id="board"></canvas>

<div class="logo">BHAICHARA</div>

<div class="online">
  <span class="dot"></span>ONLINE
</div>

<div class="info" id="info">
  P1 की बारी • Dice दबाएँ
</div>

</div>

<script>

const canvas=document.getElementById("board");
const ctx=canvas.getContext("2d");
const info=document.getElementById("info");

let size=0;
let cx=0;
let cy=0;
let dice=1;
let rolling=false;

const players=[
  {id:"P1",color:"#0879ed",light:"#35a7ff",angle:300},
  {id:"P2",color:"#f0c400",light:"#ffe85b",angle:240},
  {id:"P3",color:"#8629c7",light:"#b95aff",angle:180},
  {id:"P4",color:"#e5292f",light:"#ff656a",angle:120},
  {id:"P5",color:"#08aa55",light:"#39df80",angle:60},
  {id:"P6",color:"#ee7117",light:"#ff9b48",angle:0}
];

/* ---------------- RESIZE ---------------- */

function resize(){

  size=Math.min(window.innerWidth,window.innerHeight);

  const dpr=Math.min(devicePixelRatio||1,2);

  canvas.width=size*dpr;
  canvas.height=size*dpr;

  canvas.style.width=size+"px";
  canvas.style.height=size+"px";

  ctx.setTransform(dpr,0,0,dpr,0,0);

  cx=size/2;
  cy=size/2;

  draw();
}

window.addEventListener("resize",resize);

/* ---------------- HELPERS ---------------- */

function R(deg){
  return deg*Math.PI/180;
}

function pos(radius,angle){

  const a=R(angle-90);

  return {
    x:cx+Math.cos(a)*radius,
    y:cy+Math.sin(a)*radius
  };
}

function hex(x,y,r,fill,stroke,lw){

  ctx.beginPath();

  for(let i=0;i<6;i++){

    const a=R(i*60-30);

    const px=x+Math.cos(a)*r;
    const py=y+Math.sin(a)*r;

    if(i===0)ctx.moveTo(px,py);
    else ctx.lineTo(px,py);
  }

  ctx.closePath();

  ctx.fillStyle=fill;
  ctx.fill();

  if(stroke){
    ctx.strokeStyle=stroke;
    ctx.lineWidth=lw;
    ctx.stroke();
  }
}

/* ---------------- BACKGROUND ---------------- */

function background(){

  const g=ctx.createRadialGradient(
    cx,cy,size*.05,
    cx,cy,size*.75
  );

  g.addColorStop(0,"#102c3b");
  g.addColorStop(.5,"#06141e");
  g.addColorStop(1,"#010509");

  ctx.fillStyle=g;
  ctx.fillRect(0,0,size,size);

  /* subtle rings */

  for(let i=1;i<=5;i++){

    ctx.beginPath();

    ctx.arc(
      cx,
      cy,
      size*(.46-i*.012),
      0,
      Math.PI*2
    );

    ctx.strokeStyle="rgba(70,130,160,.08)";
    ctx.lineWidth=1;
    ctx.stroke();
  }
}

/* ---------------- GOLD FRAME ---------------- */

function frame(){

  const r=size*.455;

  ctx.save();

  ctx.shadowColor="#000";
  ctx.shadowBlur=size*.025;

  const gold=ctx.createLinearGradient(
    cx-r,cy-r,
    cx+r,cy+r
  );

  gold.addColorStop(0,"#81520f");
  gold.addColorStop(.25,"#e4a62b");
  gold.addColorStop(.5,"#ffe98a");
  gold.addColorStop(.72,"#d28c1d");
  gold.addColorStop(1,"#75460d");

  ctx.beginPath();
  ctx.arc(cx,cy,r,0,Math.PI*2);

  ctx.fillStyle="#07141e";
  ctx.fill();

  ctx.strokeStyle=gold;
  ctx.lineWidth=size*.014;
  ctx.stroke();

  ctx.restore();

  ctx.beginPath();
  ctx.arc(cx,cy,r*.95,0,Math.PI*2);

  ctx.strokeStyle="#34586c";
  ctx.lineWidth=size*.005;
  ctx.stroke();
}

/* ---------------- SIX HOME ZONES ---------------- */

function home(player){

  const outer=size*.405;
  const inner=size*.115;
  const width=27;

  const p1=pos(inner,player.angle-width);
  const p2=pos(outer,player.angle-width);
  const p3=pos(outer,player.angle+width);
  const p4=pos(inner,player.angle+width);

  const gradient=ctx.createLinearGradient(
    p2.x,p2.y,
    p3.x,p3.y
  );

  gradient.addColorStop(0,player.light);
  gradient.addColorStop(.5,player.color);
  gradient.addColorStop(1,"#101820");

  ctx.beginPath();

  ctx.moveTo(p1.x,p1.y);
  ctx.lineTo(p2.x,p2.y);
  ctx.lineTo(p3.x,p3.y);
  ctx.lineTo(p4.x,p4.y);
  ctx.closePath();

  ctx.fillStyle=gradient;
  ctx.fill();

  ctx.strokeStyle="#061019";
  ctx.lineWidth=size*.006;
  ctx.stroke();

  /* inner shadow */

  const q1=pos(size*.14,player.angle-width+3);
  const q2=pos(size*.375,player.angle-width+3);
  const q3=pos(size*.375,player.angle+width-3);
  const q4=pos(size*.14,player.angle+width-3);

  ctx.beginPath();

  ctx.moveTo(q1.x,q1.y);
  ctx.lineTo(q2.x,q2.y);
  ctx.lineTo(q3.x,q3.y);
  ctx.lineTo(q4.x,q4.y);
  ctx.closePath();

  ctx.fillStyle=player.color;
  ctx.globalAlpha=.78;
  ctx.fill();
  ctx.globalAlpha=1;
}

/* ---------------- TRACK ---------------- */

const TRACK=72;

function trackPosition(index){

  return pos(
    size*.305,
    -90+index*(360/TRACK)+90
  );
}

function drawTrack(){

  const cell=size*.034;

  for(let i=0;i<TRACK;i++){

    const p=trackPosition(i);

    let player=-1;

    for(let j=0;j<6;j++){

      if(i===j*12)
        player=j;
    }

    ctx.beginPath();

    ctx.roundRect(
      p.x-cell/2,
      p.y-cell/2,
      cell,
      cell,
      cell*.12
    );

    ctx.fillStyle=
      player>=0
      ? players[player].color
      : "#eef3f5";

    ctx.fill();

    ctx.strokeStyle="#1b2b34";
    ctx.lineWidth=size*.0015;
    ctx.stroke();

    if(player<0){

      ctx.beginPath();

      ctx.moveTo(
        p.x-cell*.28,
        p.y-cell*.27
      );

      ctx.lineTo(
        p.x+cell*.25,
        p.y-cell*.27
      );

      ctx.strokeStyle="rgba(255,255,255,.45)";
      ctx.lineWidth=1;
      ctx.stroke();
    }
  }
}

/* ---------------- SAFE STARS ---------------- */

function star(x,y,r){

  ctx.save();

  ctx.translate(x,y);

  ctx.beginPath();

  for(let i=0;i<10;i++){

    const rr=i%2===0?r:r*.42;
    const a=-Math.PI/2+i*Math.PI/5;

    const px=Math.cos(a)*rr;
    const py=Math.sin(a)*rr;

    if(i===0)ctx.moveTo(px,py);
    else ctx.lineTo(px,py);
  }

  ctx.closePath();

  ctx.fillStyle="#ffd83d";
  ctx.shadowColor="#ffd83d";
  ctx.shadowBlur=r*.7;
  ctx.fill();

  ctx.restore();
}

function safeSpots(){

  for(let p=0;p<6;p++){

    [p*12,p*12+6].forEach(index=>{

      const q=trackPosition(index);

      star(q.x,q.y,size*.012);
    });
  }
}

/* ---------------- HOME LANES ---------------- */

function lanes(){

  players.forEach(player=>{

    for(let i=1;i<=6;i++){

      const q=pos(
        size*(.265-i*.024),
        player.angle
      );

      const s=size*.031;

      ctx.beginPath();

      ctx.roundRect(
        q.x-s/2,
        q.y-s/2,
        s,
        s,
        s*.12
      );

      ctx.fillStyle=player.color;
      ctx.fill();

      ctx.strokeStyle="#172630";
      ctx.lineWidth=1;
      ctx.stroke();
    }
  });
}

/* ---------------- TOKENS ---------------- */

function token(x,y,player,r){

  ctx.save();

  ctx.shadowColor="rgba(0,0,0,.8)";
  ctx.shadowBlur=r*.8;
  ctx.shadowOffsetY=r*.4;

  const g=ctx.createRadialGradient(
    x-r*.4,
    y-r*.5,
    r*.05,
    x,
    y,
    r
  );

  g.addColorStop(0,"#ffffff");
  g.addColorStop(.12,player.light);
  g.addColorStop(.52,player.color);
  g.addColorStop(1,"#101010");

  ctx.beginPath();
  ctx.arc(x,y,r,0,Math.PI*2);

  ctx.fillStyle=g;
  ctx.fill();

  ctx.restore();

  ctx.beginPath();
  ctx.arc(x,y,r*.65,0,Math.PI*2);

  ctx.strokeStyle="#ffffff";
  ctx.lineWidth=Math.max(1,r*.09);
  ctx.stroke();

  ctx.beginPath();

  ctx.arc(
    x-r*.3,
    y-r*.36,
    r*.13,
    0,
    Math.PI*2
  );

  ctx.fillStyle="rgba(255,255,255,.7)";
  ctx.fill();
}

/* ---------------- PLAYER BASES ---------------- */

function bases(){

  players.forEach(player=>{

    const p=pos(size*.405,player.angle);

    ctx.save();

    ctx.shadowColor="#000";
    ctx.shadowBlur=size*.02;

    ctx.beginPath();
    ctx.arc(
      p.x,
      p.y,
      size*.052,
      0,
      Math.PI*2
    );

    ctx.fillStyle="#061019";
    ctx.fill();

    ctx.strokeStyle="#ffffff25";
    ctx.lineWidth=2;
    ctx.stroke();

    ctx.restore();

    const gap=size*.023;

    token(p.x-gap,p.y-gap,player,size*.021);
    token(p.x+gap,p.y-gap,player,size*.021);
    token(p.x-gap,p.y+gap,player,size*.021);
    token(p.x+gap,p.y+gap,player,size*.021);

    const label=pos(size*.448,player.angle);

    ctx.fillStyle="#fff";
    ctx.font=`900 ${size*.021}px Arial`;
    ctx.textAlign="center";
    ctx.textBaseline="middle";

    ctx.fillText(
      player.id,
      label.x,
      label.y
    );
  });
}

/* ---------------- CENTER DICE ---------------- */

function center(){

  const r=size*.095;

  hex(
    cx,
    cy,
    r,
    "#06121b",
    "#e8b63d",
    size*.008
  );

  hex(
    cx,
    cy,
    r*.78,
    "#087edc",
    "#68c9ff",
    size*.004
  );

  ctx.beginPath();

  ctx.arc(
    cx,
    cy,
    r*.53,
    0,
    Math.PI*2
  );

  const blue=ctx.createRadialGradient(
    cx-r*.2,
    cy-r*.2,
    r*.05,
    cx,
    cy,
    r*.55
  );

  blue.addColorStop(0,"#5bc7ff");
  blue.addColorStop(.45,"#087fe0");
  blue.addColorStop(1,"#033a71");

  ctx.fillStyle=blue;
  ctx.fill();

  ctx.strokeStyle="#91ddff";
  ctx.lineWidth=size*.003;
  ctx.stroke();

  drawDice();
}

/* ---------------- DICE ---------------- */

function drawDice(){

  const r=size*.043;

  ctx.save();

  ctx.shadowColor="#000";
  ctx.shadowBlur=size*.012;
  ctx.shadowOffsetY=size*.006;

  ctx.beginPath();

  ctx.roundRect(
    cx-r,
    cy-r,
    r*2,
    r*2,
    r*.18
  );

  ctx.fillStyle="#f8fafb";
  ctx.fill();

  ctx.strokeStyle="#c7d7df";
  ctx.lineWidth=2;
  ctx.stroke();

  ctx.restore();

  const spots={
    1:[[0,0]],
    2:[[-.32,-.32],[.32,.32]],
    3:[[-.32,-.32],[0,0],[.32,.32]],
    4:[[-.32,-.32],[.32,-.32],[-.32,.32],[.32,.32]],
    5:[[-.32,-.32],[.32,-.32],[0,0],[-.32,.32],[.32,.32]],
    6:[[-.32,-.32],[.32,-.32],[-.32,0],[.32,0],[-.32,.32],[.32,.32]]
  };

  spots[dice].forEach(s=>{

    ctx.beginPath();

    ctx.arc(
      cx+s[0]*r*1.4,
      cy+s[1]*r*1.4,
      r*.095,
      0,
      Math.PI*2
    );

    ctx.fillStyle="#d31c25";
    ctx.fill();
  });
}

/* ---------------- ARROWS ---------------- */

function arrows(){

  players.forEach((player,i)=>{

    const q=trackPosition(i*12+9);

    ctx.save();

    ctx.translate(q.x,q.y);

    ctx.rotate(R(i*60));

    ctx.fillStyle=player.color;

    ctx.beginPath();
    ctx.moveTo(size*.012,0);
    ctx.lineTo(-size*.007,-size*.006);
    ctx.lineTo(-size*.003,0);
    ctx.lineTo(-size*.007,size*.006);
    ctx.closePath();

    ctx.fill();

    ctx.restore();
  });
}

/* ---------------- DRAW ---------------- */

function draw(){

  background();

  frame();

  players.forEach(home);

  drawTrack();

  lanes();

  safeSpots();

  arrows();

  bases();

  center();
}

/* ---------------- DICE CLICK ---------------- */

canvas.addEventListener("click",e=>{

  const rect=canvas.getBoundingClientRect();

  const x=e.clientX-rect.left;
  const y=e.clientY-rect.top;

  const d=Math.hypot(x-cx,y-cy);

  if(d<size*.13){
    rollDice();
  }
});

/* ---------------- ROLL ---------------- */

function rollDice(){

  if(rolling)return;

  rolling=true;

  let n=0;

  const timer=setInterval(()=>{

    dice=Math.floor(Math.random()*6)+1;

    draw();

    n++;

    if(n>=12){

      clearInterval(timer);

      dice=Math.floor(Math.random()*6)+1;

      draw();

      rolling=false;

      info.textContent=
        `P1 की बारी • ${dice} आया • Token चुनें`;
    }

  },65);
}

resize();

</script>

</body>
</html>
