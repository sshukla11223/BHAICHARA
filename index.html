<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>BHAICHARA — 6 Player Ludo</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#050b10;
  font-family:Arial,sans-serif;
}

body{
  display:flex;
  justify-content:center;
  align-items:center;
}

#app{
  position:relative;
  width:min(100vw,100vh);
  height:min(100vw,100vh);
}

canvas{
  width:100%;
  height:100%;
  display:block;
}

.logo{
  position:absolute;
  left:20px;
  top:12px;
  color:#fff;
  font-size:clamp(20px,4vw,34px);
  font-weight:900;
  letter-spacing:3px;
  text-shadow:0 4px 10px #000;
  z-index:5;
}

.online{
  position:absolute;
  right:18px;
  top:15px;
  color:#53ff9e;
  border:1px solid #53ff9e;
  border-radius:25px;
  padding:7px 15px;
  background:#03100be8;
  font-weight:800;
  font-size:12px;
  z-index:5;
}

.online span{
  display:inline-block;
  width:7px;
  height:7px;
  background:#42ff98;
  border-radius:50%;
  margin-right:6px;
  box-shadow:0 0 10px #42ff98;
}

.turn{
  position:absolute;
  bottom:9px;
  left:50%;
  transform:translateX(-50%);
  color:white;
  background:#050b10e8;
  border:1px solid #ffffff35;
  border-radius:22px;
  padding:8px 18px;
  font-size:12px;
  font-weight:bold;
  white-space:nowrap;
  z-index:5;
}
</style>
</head>

<body>

<div id="app">

<canvas id="board"></canvas>

<div class="logo">BHAICHARA</div>

<div class="online">
  <span></span>ONLINE
</div>

<div class="turn" id="turn">
  P1 की बारी • Dice दबाएँ
</div>

</div>

<script>

/* =========================================================
   BHAICHARA
   PURE JAVASCRIPT CANVAS BOARD
   ========================================================= */

const canvas = document.getElementById("board");
const ctx = canvas.getContext("2d");
const turnText = document.getElementById("turn");

let W,H,S,CX,CY;

/* ---------------------------------------------------------
   PLAYERS
--------------------------------------------------------- */

const players = [
  {
    name:"P1",
    color:"#087cf0",
    light:"#38a5ff",
    angle:60,
    team:0
  },
  {
    name:"P2",
    color:"#f0c400",
    light:"#ffe44c",
    angle:120,
    team:1
  },
  {
    name:"P3",
    color:"#8427c7",
    light:"#b44eff",
    angle:180,
    team:2
  },
  {
    name:"P4",
    color:"#e52229",
    light:"#ff5b60",
    angle:240,
    team:0
  },
  {
    name:"P5",
    color:"#0aad55",
    light:"#35dc7d",
    angle:300,
    team:1
  },
  {
    name:"P6",
    color:"#ed7116",
    light:"#ff9b43",
    angle:0,
    team:2
  }
];

const partner = {
  0:3,
  3:0,
  1:4,
  4:1,
  2:5,
  5:2
};

/* ---------------------------------------------------------
   RESIZE
--------------------------------------------------------- */

function resize(){

  const dpr = Math.min(window.devicePixelRatio || 1,2);

  W = canvas.clientWidth;
  H = canvas.clientHeight;
  S = Math.min(W,H);

  canvas.width = W*dpr;
  canvas.height = H*dpr;

  ctx.setTransform(dpr,0,0,dpr,0,0);

  CX=W/2;
  CY=H/2;

  draw();
}

window.addEventListener("resize",resize);

/* ---------------------------------------------------------
   HELPERS
--------------------------------------------------------- */

function rad(deg){
  return deg*Math.PI/180;
}

function point(cx,cy,r,angle){

  const a=rad(angle-90);

  return {
    x:cx+r*Math.cos(a),
    y:cy+r*Math.sin(a)
  };
}

function polygon(points,fill,stroke=null,width=1){

  ctx.beginPath();

  points.forEach((p,i)=>{
    if(i===0)ctx.moveTo(p.x,p.y);
    else ctx.lineTo(p.x,p.y);
  });

  ctx.closePath();

  if(fill){
    ctx.fillStyle=fill;
    ctx.fill();
  }

  if(stroke){
    ctx.strokeStyle=stroke;
    ctx.lineWidth=width;
    ctx.stroke();
  }
}

function roundedRect(x,y,w,h,r,fill,stroke=null,lw=1){

  ctx.beginPath();
  ctx.roundRect(x,y,w,h,r);

  ctx.fillStyle=fill;
  ctx.fill();

  if(stroke){
    ctx.strokeStyle=stroke;
    ctx.lineWidth=lw;
    ctx.stroke();
  }
}

/* ---------------------------------------------------------
   BACKGROUND
--------------------------------------------------------- */

function background(){

  const g=ctx.createRadialGradient(
    CX,CY,S*.05,
    CX,CY,S*.8
  );

  g.addColorStop(0,"#173b4c");
  g.addColorStop(.45,"#091923");
  g.addColorStop(1,"#02070b");

  ctx.fillStyle=g;
  ctx.fillRect(0,0,W,H);

  /* subtle golden light */

  const glow=ctx.createRadialGradient(
    CX,CY,S*.2,
    CX,CY,S*.72
  );

  glow.addColorStop(0,"rgba(255,180,40,.08)");
  glow.addColorStop(1,"rgba(0,0,0,0)");

  ctx.fillStyle=glow;
  ctx.fillRect(0,0,W,H);
}

/* ---------------------------------------------------------
   OUTER BOARD
--------------------------------------------------------- */

function outerBoard(){

  const R=S*.455;

  ctx.save();

  ctx.shadowColor="rgba(0,0,0,.8)";
  ctx.shadowBlur=S*.025;
  ctx.shadowOffsetY=S*.015;

  ctx.beginPath();
  ctx.arc(CX,CY,R,0,Math.PI*2);

  const gold=ctx.createLinearGradient(
    CX-R,CY-R,
    CX+R,CY+R
  );

  gold.addColorStop(0,"#8a5712");
  gold.addColorStop(.25,"#e3a52d");
  gold.addColorStop(.5,"#ffe58a");
  gold.addColorStop(.7,"#d48f1e");
  gold.addColorStop(1,"#70420d");

  ctx.fillStyle="#06131d";
  ctx.fill();

  ctx.strokeStyle=gold;
  ctx.lineWidth=S*.018;
  ctx.stroke();

  ctx.restore();

  ctx.beginPath();
  ctx.arc(CX,CY,R*.94,0,Math.PI*2);

  ctx.strokeStyle="#35596d";
  ctx.lineWidth=S*.006;
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(CX,CY,R*.88,0,Math.PI*2);

  ctx.strokeStyle="#06131d";
  ctx.lineWidth=S*.035;
  ctx.stroke();
}

/* ---------------------------------------------------------
   SIX HOME SECTORS
--------------------------------------------------------- */

function homeSector(player){

  const R1=S*.145;
  const R2=S*.405;

  const a=player.angle;

  const p1=point(CX,CY,R1,a-28);
  const p2=point(CX,CY,R2,a-28);
  const p3=point(CX,CY,R2,a+28);
  const p4=point(CX,CY,R1,a+28);

  const grad=ctx.createLinearGradient(
    p2.x,p2.y,
    p3.x,p3.y
  );

  grad.addColorStop(0,player.light);
  grad.addColorStop(.5,player.color);
  grad.addColorStop(1,"#111");

  polygon(
    [p1,p2,p3,p4],
    grad,
    "#06131c",
    S*.005
  );

  /* inner highlight */

  const q1=point(CX,CY,R1+S*.01,a-23);
  const q2=point(CX,CY,R2-S*.025,a-23);
  const q3=point(CX,CY,R2-S*.025,a+23);
  const q4=point(CX,CY,R1+S*.01,a+23);

  polygon(
    [q1,q2,q3,q4],
    player.color,
    null
  );
}

function allHomes(){

  players.forEach(homeSector);
}

/* ---------------------------------------------------------
   PLAYER HOME TOKEN AREA
--------------------------------------------------------- */

function homeBase(player){

  const pos=point(
    CX,
    CY,
    S*.382,
    player.angle
  );

  ctx.save();

  ctx.shadowColor="#000";
  ctx.shadowBlur=S*.025;

  ctx.beginPath();
  ctx.arc(
    pos.x,
    pos.y,
    S*.052,
    0,
    Math.PI*2
  );

  ctx.fillStyle="#061019";
  ctx.fill();

  ctx.strokeStyle="#ffffff30";
  ctx.lineWidth=S*.003;
  ctx.stroke();

  ctx.restore();

  const gap=S*.026;

  const places=[
    [-gap,-gap],
    [gap,-gap],
    [-gap,gap],
    [gap,gap]
  ];

  places.forEach(([dx,dy])=>{
    token(
      pos.x+dx,
      pos.y+dy,
      player,
      S*.022
    );
  });

  ctx.fillStyle="#fff";
  ctx.font=`900 ${S*.021}px Arial`;
  ctx.textAlign="center";
  ctx.textBaseline="middle";

  const label=point(
    CX,
    CY,
    S*.435,
    player.angle
  );

  ctx.fillText(
    player.name,
    label.x,
    label.y
  );
}

/* ---------------------------------------------------------
   TOKEN
--------------------------------------------------------- */

function token(x,y,player,r){

  ctx.save();

  ctx.shadowColor="rgba(0,0,0,.7)";
  ctx.shadowBlur=r*.8;
  ctx.shadowOffsetY=r*.4;

  const g=ctx.createRadialGradient(
    x-r*.45,
    y-r*.55,
    r*.1,
    x,
    y,
    r*1.2
  );

  g.addColorStop(0,"#fff");
  g.addColorStop(.08,player.light);
  g.addColorStop(.45,player.color);
  g.addColorStop(1,"#111");

  ctx.beginPath();
  ctx.arc(x,y,r,0,Math.PI*2);

  ctx.fillStyle=g;
  ctx.fill();

  ctx.restore();

  /* outer ring */

  ctx.beginPath();
  ctx.arc(x,y,r*.68,0,Math.PI*2);

  ctx.strokeStyle="#fff";
  ctx.lineWidth=Math.max(1,r*.11);
  ctx.stroke();

  /* highlight */

  ctx.beginPath();
  ctx.ellipse(
    x-r*.28,
    y-r*.38,
    r*.25,
    r*.12,
    -.35,
    0,
    Math.PI*2
  );

  ctx.fillStyle="rgba(255,255,255,.65)";
  ctx.fill();
}

/* ---------------------------------------------------------
   TRACK
--------------------------------------------------------- */

const TRACK_COUNT=72;

function trackPoint(i){

  const angle=-90+i*(360/TRACK_COUNT);

  return point(
    CX,
    CY,
    S*.323,
    angle
  );
}

function track(){

  const cell=S*.034;

  for(let i=0;i<TRACK_COUNT;i++){

    const p=trackPoint(i);

    let owner=-1;

    players.forEach((pl,index)=>{

      const start=index*12;

      if(i===start)
        owner=index;

    });

    roundedRect(
      p.x-cell/2,
      p.y-cell/2,
      cell,
      cell,
      cell*.15,
      owner>=0
        ? players[owner].color
        : "#edf3f5",
      "#263741",
      S*.0015
    );

    if(owner<0){

      roundedRect(
        p.x-cell*.36,
        p.y-cell*.36,
        cell*.72,
        cell*.18,
        2,
        "rgba(255,255,255,.35)"
      );
    }
  }
}

/* ---------------------------------------------------------
   12 SAFE STARS
--------------------------------------------------------- */

function star(x,y,r,color="#ffd943"){

  ctx.save();

  ctx.translate(x,y);

  ctx.beginPath();

  for(let i=0;i<10;i++){

    const rr=i%2===0?r:r*.42;
    const a=-Math.PI/2+i*Math.PI/5;

    const px=Math.cos(a)*rr;
    const py=Math.sin(a)*rr;

    if(i===0)ctx.moveTo(px,py);
    else ctx.lineTo(px,py);
  }

  ctx.closePath();

  ctx.fillStyle=color;
  ctx.shadowColor=color;
  ctx.shadowBlur=r*.4;
  ctx.fill();

  ctx.restore();
}

function safeStars(){

  const safeIndexes=[];

  for(let i=0;i<6;i++){

    safeIndexes.push(i*12);
    safeIndexes.push(i*12+6);
  }

  safeIndexes.forEach(i=>{

    const p=trackPoint(i);

    star(
      p.x,
      p.y,
      S*.012
    );
  });
}

/* ---------------------------------------------------------
   ARROWS
--------------------------------------------------------- */

function arrow(x,y,angle,color){

  ctx.save();

  ctx.translate(x,y);
  ctx.rotate(rad(angle));

  ctx.fillStyle=color;

  ctx.beginPath();
  ctx.moveTo(S*.012,0);
  ctx.lineTo(-S*.007,-S*.007);
  ctx.lineTo(-S*.003,0);
  ctx.lineTo(-S*.007,S*.007);
  ctx.closePath();

  ctx.fill();

  ctx.restore();
}

function arrows(){

  players.forEach((p,i)=>{

    const index=i*12+9;
    const pos=trackPoint(index);

    arrow(
      pos.x,
      pos.y,
      index*5,
      p.color
    );
  });
}

/* ---------------------------------------------------------
   COLORED HOME LANES
--------------------------------------------------------- */

function homeLane(player){

  for(let n=1;n<=6;n++){

    const r=S*(.265-n*.024);

    const pos=point(
      CX,
      CY,
      r,
      player.angle
    );

    const size=S*.031;

    roundedRect(
      pos.x-size/2,
      pos.y-size/2,
      size,
      size,
      size*.13,
      player.color,
      "#172630",
      S*.0015
    );
  }
}

function lanes(){

  players.forEach(homeLane);
}

/* ---------------------------------------------------------
   CENTER
--------------------------------------------------------- */

function center(){

  const r=S*.105;

  ctx.save();

  ctx.shadowColor="#000";
  ctx.shadowBlur=S*.025;

  ctx.beginPath();

  for(let i=0;i<6;i++){

    const p=point(
      CX,
      CY,
      r,
      i*60
    );

    if(i===0)ctx.moveTo(p.x,p.y);
    else ctx.lineTo(p.x,p.y);
  }

  ctx.closePath();

  const g=ctx.createLinearGradient(
    CX-r,CY-r,
    CX+r,CY+r
  );

  g.addColorStop(0,"#0d2d43");
  g.addColorStop(.45,"#0d7ce0");
  g.addColorStop(1,"#064078");

  ctx.fillStyle=g;
  ctx.fill();

  ctx.strokeStyle="#f0b738";
  ctx.lineWidth=S*.008;
  ctx.stroke();

  ctx.restore();

  /* blue inner ring */

  ctx.beginPath();
  ctx.arc(CX,CY,r*.68,0,Math.PI*2);

  const blue=ctx.createRadialGradient(
    CX,CY,r*.1,
    CX,CY,r*.68
  );

  blue.addColorStop(0,"#54c4ff");
  blue.addColorStop(.5,"#087de0");
  blue.addColorStop(1,"#032c59");

  ctx.fillStyle=blue;
  ctx.fill();

  ctx.strokeStyle="#74d5ff";
  ctx.lineWidth=S*.004;
  ctx.stroke();

  drawDice();
}

/* ---------------------------------------------------------
   3D DICE
--------------------------------------------------------- */

let diceNumber=1;

function drawDice(){

  const r=S*.043;

  ctx.save();

  ctx.shadowColor="rgba(0,0,0,.7)";
  ctx.shadowBlur=S*.015;
  ctx.shadowOffsetY=S*.008;

  /* cube body */

  roundedRect(
    CX-r,
    CY-r,
    r*2,
    r*2,
    r*.2,
    "#f5f8fa",
    "#d4e0e6",
    S*.002
  );

  ctx.restore();

  const patterns={
    1:[[0,0]],
    2:[[-.3,-.3],[.3,.3]],
    3:[[-.3,-.3],[0,0],[.3,.3]],
    4:[[-.3,-.3],[.3,-.3],[-.3,.3],[.3,.3]],
    5:[[-.3,-.3],[.3,-.3],[0,0],[-.3,.3],[.3,.3]],
    6:[[-.3,-.32],[.3,-.32],[-.3,0],[.3,0],[-.3,.32],[.3,.32]]
  };

  patterns[diceNumber].forEach(([px,py])=>{

    ctx.beginPath();

    ctx.arc(
      CX+px*r*1.45,
      CY+py*r*1.45,
      r*.11,
      0,
      Math.PI*2
    );

    ctx.fillStyle="#d10d16";
    ctx.fill();
  });
}

/* ---------------------------------------------------------
   ALL HOME BASES
--------------------------------------------------------- */

function bases(){

  players.forEach(homeBase);
}

/* ---------------------------------------------------------
   DRAW
--------------------------------------------------------- */

function draw(){

  if(!W)return;

  ctx.clearRect(0,0,W,H);

  background();

  outerBoard();

  allHomes();

  track();

  lanes();

  safeStars();

  arrows();

  bases();

  center();
}

/* ---------------------------------------------------------
   DICE CLICK
--------------------------------------------------------- */

canvas.addEventListener("click",e=>{

  const rect=canvas.getBoundingClientRect();

  const x=e.clientX-rect.left;
  const y=e.clientY-rect.top;

  const dx=x-CX;
  const dy=y-CY;

  const distance=Math.sqrt(dx*dx+dy*dy);

  if(distance<S*.13){

    rollDice();
  }
});

/* ---------------------------------------------------------
   DICE ROLL
--------------------------------------------------------- */

let rolling=false;

function rollDice(){

  if(rolling)return;

  rolling=true;

  let count=0;

  const timer=setInterval(()=>{

    diceNumber=
      Math.floor(Math.random()*6)+1;

    draw();

    count++;

    if(count>=12){

      clearInterval(timer);

      diceNumber=
        Math.floor(Math.random()*6)+1;

      draw();

      rolling=false;

      turnText.textContent=
        `P1 की बारी • ${diceNumber} आया • Token चुनें`;
    }

  },70);
}

/* ---------------------------------------------------------
   START
--------------------------------------------------------- */

resize();

</script>

</body>
</html>
