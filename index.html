<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>BHAICHARA</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:
    radial-gradient(circle at center,#123348 0%,#06131e 55%,#02070c 100%);
  font-family:Arial,sans-serif;
}

body{
  display:flex;
  justify-content:center;
  align-items:center;
}

.game{
  width:min(96vw,96vh,900px);
  height:min(96vw,96vh,900px);
  position:relative;
}

.title{
  position:absolute;
  top:5px;
  left:18px;
  z-index:20;
  color:white;
  font-size:clamp(18px,4vw,30px);
  font-weight:900;
  letter-spacing:4px;
  text-shadow:0 3px 8px #000;
}

.online{
  position:absolute;
  right:18px;
  top:8px;
  z-index:20;
  padding:7px 13px;
  border:1px solid #43ff9a;
  border-radius:20px;
  color:#59ffad;
  font-size:11px;
  font-weight:bold;
  background:#03120dcc;
}

.online span{
  display:inline-block;
  width:7px;
  height:7px;
  margin-right:5px;
  border-radius:50%;
  background:#45ff9b;
  box-shadow:0 0 10px #45ff9b;
}

svg{
  position:absolute;
  width:100%;
  height:100%;
  left:0;
  top:0;
}

.cell{
  stroke:#172936;
  stroke-width:2;
}

.token{
  cursor:pointer;
}

.selectable{
  animation:pulse .65s infinite alternate;
}

@keyframes pulse{
  from{
    filter:drop-shadow(0 0 2px white);
  }
  to{
    filter:drop-shadow(0 0 13px white);
  }
}

#dice{
  cursor:pointer;
}

#dice.disabled{
  opacity:.5;
}

.turn{
  position:absolute;
  bottom:8px;
  left:50%;
  transform:translateX(-50%);
  background:#020911dd;
  border:1px solid #ffffff33;
  border-radius:30px;
  padding:8px 16px;
  color:#fff;
  font-size:12px;
  font-weight:bold;
  white-space:nowrap;
  z-index:30;
}

.notice{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  padding:12px 22px;
  background:#020912ed;
  border:1px solid #ffffff44;
  border-radius:15px;
  color:white;
  font-weight:bold;
  z-index:50;
  opacity:0;
  pointer-events:none;
  transition:.2s;
}

.notice.show{
  opacity:1;
}
</style>
</head>

<body>

<div class="game">

<div class="title">BHAICHARA</div>

<div class="online">
<span></span>ONLINE
</div>

<svg viewBox="0 0 1000 1000">

<defs>

<linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#81530e"/>
<stop offset=".45" stop-color="#ffe17b"/>
<stop offset="1" stop-color="#9b6415"/>
</linearGradient>

<radialGradient id="blueToken">
<stop offset="0" stop-color="#5bc3ff"/>
<stop offset=".65" stop-color="#168be5"/>
<stop offset="1" stop-color="#03497e"/>
</radialGradient>

<radialGradient id="yellowToken">
<stop offset="0" stop-color="#fff46a"/>
<stop offset=".65" stop-color="#edc400"/>
<stop offset="1" stop-color="#8b6800"/>
</radialGradient>

<radialGradient id="purpleToken">
<stop offset="0" stop-color="#e19aff"/>
<stop offset=".65" stop-color="#9234c7"/>
<stop offset="1" stop-color="#4b126d"/>
</radialGradient>

<radialGradient id="redToken">
<stop offset="0" stop-color="#ff7777"/>
<stop offset=".65" stop-color="#dd3030"/>
<stop offset="1" stop-color="#741313"/>
</radialGradient>

<radialGradient id="greenToken">
<stop offset="0" stop-color="#71ffa1"/>
<stop offset=".65" stop-color="#19aa59"/>
<stop offset="1" stop-color="#075b2d"/>
</radialGradient>

<radialGradient id="orangeToken">
<stop offset="0" stop-color="#ffc078"/>
<stop offset=".65" stop-color="#ef751b"/>
<stop offset="1" stop-color="#873600"/>
</radialGradient>

<filter id="shadow">
<feDropShadow dx="0" dy="8" stdDeviation="8"
flood-color="#000" flood-opacity=".65"/>
</filter>

</defs>

<!-- OUTER BOARD -->

<circle
cx="500"
cy="500"
r="465"
fill="#06121c"
stroke="url(#gold)"
stroke-width="20"
filter="url(#shadow)"
/>

<circle
cx="500"
cy="500"
r="435"
fill="#092332"
stroke="#294a60"
stroke-width="5"
/>

<!-- HOME ZONES -->
<g id="homes"></g>

<!-- TRACK -->
<g id="track"></g>

<!-- SAFE STARS -->
<g id="safe"></g>

<!-- CENTER -->
<polygon
points="500,365 617,432 617,568 500,635 383,568 383,432"
fill="#06121c"
stroke="url(#gold)"
stroke-width="10"
filter="url(#shadow)"
/>

<polygon
points="500,390 590,442 590,558 500,610 410,558 410,442"
fill="#1578d1"
stroke="#7ed1ff"
stroke-width="4"
/>

<!-- DICE -->
<g id="dice" transform="translate(500 500)">

<polygon
points="0,-55 48,-28 48,28 0,55 -48,28 -48,-28"
fill="#1479d4"
stroke="#a4dcff"
stroke-width="4"
/>

<g id="pips"></g>

</g>

<!-- TOKENS -->
<g id="tokens"></g>

</svg>

<div id="notice" class="notice"></div>

<div id="turn" class="turn">
P1 की बारी • Dice दबाएँ
</div>

</div>


<script>

/* =====================================
   BHAICHARA
   6 PLAYERS / 3 PARTNER TEAMS
   ===================================== */

const NS="http://www.w3.org/2000/svg";

const homes=document.getElementById("homes");
const track=document.getElementById("track");
const safeLayer=document.getElementById("safe");
const tokensLayer=document.getElementById("tokens");
const pips=document.getElementById("pips");
const dice=document.getElementById("dice");

const turnBox=document.getElementById("turn");
const notice=document.getElementById("notice");


/* PLAYERS */

const players=[
{
 id:0,
 name:"P1",
 color:"#168bea",
 gradient:"url(#blueToken)",
 team:0
},
{
 id:1,
 name:"P2",
 color:"#f1c900",
 gradient:"url(#yellowToken)",
 team:1
},
{
 id:2,
 name:"P3",
 color:"#8a32c5",
 gradient:"url(#purpleToken)",
 team:2
},
{
 id:3,
 name:"P4",
 color:"#dd3030",
 gradient:"url(#redToken)",
 team:0
},
{
 id:4,
 name:"P5",
 color:"#19aa59",
 gradient:"url(#greenToken)",
 team:1
},
{
 id:5,
 name:"P6",
 color:"#ef751b",
 gradient:"url(#orangeToken)",
 team:2
}
];


/* PARTNERS */

const partner={
 0:3,
 3:0,
 1:4,
 4:1,
 2:5,
 5:2
};


/* BOARD */

const CX=500;
const CY=500;

const PATH_RADIUS=330;

const TOTAL_CELLS=72;


/* START POSITIONS */

const starts=[
 0,
 12,
 24,
 36,
 48,
 60
];


/* 12 SAFE STARS */

const safe=[];

for(let i=0;i<6;i++){

 safe.push(starts[i]);

 safe.push((starts[i]+6)%TOTAL_CELLS);

}


/* HOME ANGLES */

const homeAngles=[
 -90,
 -30,
 30,
 90,
 150,
 210
];


/* =====================================
   SVG HELPERS
   ===================================== */

function create(tag,attrs={}){

 const node=document.createElementNS(NS,tag);

 for(const key in attrs){
   node.setAttribute(key,attrs[key]);
 }

 return node;
}


function polar(radius,angle){

 const rad=(angle-90)*Math.PI/180;

 return [
   CX+radius*Math.cos(rad),
   CY+radius*Math.sin(rad)
 ];

}


function pathPoint(index){

 index=((index%TOTAL_CELLS)+TOTAL_CELLS)%TOTAL_CELLS;

 const angle=index*360/TOTAL_CELLS;

 return polar(PATH_RADIUS,angle);

}


/* =====================================
   HOME AREAS
   ===================================== */

players.forEach((player,i)=>{

 const angle=homeAngles[i];

 const left=polar(430,angle-24);
 const right=polar(430,angle+24);

 const polygon=create("polygon",{
   points:
   `${CX},${CY} ${left[0]},${left[1]} ${right[0]},${right[1]}`,
   fill:player.color,
   opacity:"0.9",
   stroke:"#07131d",
   "stroke-width":"6"
 });

 homes.appendChild(polygon);


 /* HOME CIRCLE */

 const center=polar(365,angle);

 const circle=create("circle",{
   cx:center[0],
   cy:center[1],
   r:72,
   fill:"#06131d",
   stroke:"#ffffff40",
   "stroke-width":"3"
 });

 homes.appendChild(circle);


 /* PLAYER NAME */

 const text=create("text",{
   x:center[0],
   y:center[1]-90,
   fill:"#fff",
   "font-size":"21",
   "font-weight":"900",
   "text-anchor":"middle"
 });

 text.textContent=player.name;

 homes.appendChild(text);

});


/* =====================================
   CIRCULAR TRACK
   ===================================== */

for(let i=0;i<TOTAL_CELLS;i++){

 const [x,y]=pathPoint(i);

 let color="#dce6eb";

 const startPlayer=starts.indexOf(i);

 if(startPlayer!==-1){
   color=players[startPlayer].color;
 }

 const cell=create("rect",{
   x:x-18,
   y:y-18,
   width:36,
   height:36,
   rx:7,
   fill:color,
   class:"cell"
 });

 track.appendChild(cell);

}


/* =====================================
   SAFE STARS
   ===================================== */

safe.forEach(index=>{

 const [x,y]=pathPoint(index);

 const star=create("text",{
   x:x,
   y:y+8,
   fill:"#ffd84d",
   "font-size":"26",
   "font-weight":"900",
   "text-anchor":"middle",
   "pointer-events":"none"
 });

 star.textContent="★";

 safeLayer.appendChild(star);

});


/* =====================================
   HOME TOKEN LOCATIONS
   ===================================== */

const homePositions={};

players.forEach((player,i)=>{

 const center=polar(365,homeAngles[i]);

 homePositions[player.id]=[
   [center[0]-27,center[1]-27],
   [center[0]+27,center[1]-27],
   [center[0]-27,center[1]+27],
   [center[0]+27,center[1]+27]
 ];

});


/* =====================================
   TOKEN DATA
   ===================================== */

const tokens=[];

for(let p=0;p<6;p++){

 for(let n=0;n<4;n++){

   tokens.push({

     id:p+"-"+n,

     player:p,

     number:n,

     progress:-1,

     finished:false,

     node:null

   });

 }

}


/*
 -1  = BASE
 0-71 = CIRCULAR TRACK
 72-77 = HOME LANE
 78 = FINISHED
*/


function globalPosition(token){

 if(token.progress<0)return null;

 if(token.progress>=72)return null;

 return (starts[token.player]+token.progress)%TOTAL_CELLS;

}


/* =====================================
   TOKEN POSITION
   ===================================== */

function tokenPosition(token){

 if(token.progress===-1){

   return homePositions[token.player][token.number];

 }


 if(token.progress>=72){

   const angle=homeAngles[token.player];

   const lane=token.progress-72;

   const radius=285-(lane*28);

   return polar(radius,angle);

 }


 return pathPoint(globalPosition(token));

}


/* =====================================
   DRAW TOKENS
   ===================================== */

function drawTokens(){

 tokensLayer.innerHTML="";

 tokens.forEach(token=>{

   const player=players[token.player];

   const pos=tokenPosition(token);

   const group=create("g",{
     class:"token",
     transform:`translate(${pos[0]},${pos[1]})`
   });


   if(selectable(token)){
     group.classList.add("selectable");
   }


   /* SHADOW */

   const shadow=create("circle",{
     cx:"3",
     cy:"5",
     r:"14",
     fill:"#000",
     opacity:"0.45"
   });


   /* OUTER RING */

   const outer=create("circle",{
     cx:"0",
     cy:"0",
     r:"14",
     fill:player.gradient,
     stroke:"#06131d",
     "stroke-width":"2"
   });


   /* INNER RING */

   const ring=create("circle",{
     cx:"0",
     cy:"0",
     r:"10",
     fill:"none",
     stroke:"#ffffff",
     "stroke-width":"1.5",
     opacity:"0.5"
   });


   /* SHINE */

   const shine=create("circle",{
     cx:"-4",
     cy:"-5",
     r:"3",
     fill:"#fff",
     opacity:"0.65"
   });


   group.appendChild(shadow);
   group.appendChild(outer);
   group.appendChild(ring);
   group.appendChild(shine);


   group.addEventListener("click",()=>{

     if(selectable(token)){
       moveToken(token);
     }

   });


   tokensLayer.appendChild(group);

   token.node=group;

 });

}


/* =====================================
   TURN
   ===================================== */

let currentPlayer=0;

let diceValue=0;

let rolling=false;


function ownFinished(player){

 return tokens.filter(t=>
   t.player===player &&
   t.finished
 ).length===4;

}


function teamFinished(team){

 return tokens.filter(t=>
   players[t.player].team===team &&
   t.finished
 ).length===8;

}


function controllablePlayers(player){

 const list=[player];

 if(ownFinished(player)){
   list.push(partner[player]);
 }

 return list;

}


/* =====================================
   MOVE CHECK
   ===================================== */

function canMove(token,roll){

 if(token.finished)return false;

 if(token.progress===-1){
   return roll===6;
 }

 return token.progress+roll<=78;

}


function selectable(token){

 if(rolling)return false;

 if(diceValue===0)return false;

 if(!controllablePlayers(currentPlayer).includes(token.player)){
   return false;
 }

 return canMove(token,diceValue);

}


/* =====================================
   DICE
   ===================================== */

function showDice(number){

 pips.innerHTML="";

 const pattern={

 1:[[0,0]],

 2:[
   [-20,-20],
   [20,20]
 ],

 3:[
   [-20,-20],
   [0,0],
   [20,20]
 ],

 4:[
   [-20,-20],
   [20,-20],
   [-20,20],
   [20,20]
 ],

 5:[
   [-20,-20],
   [20,-20],
   [0,0],
   [-20,20],
   [20,20]
 ],

 6:[
   [-20,-22],
   [20,-22],
   [-20,0],
   [20,0],
   [-20,22],
   [20,22]
 ]

 };


 pattern[number].forEach(point=>{

   const pip=create("circle",{
     cx:point[0],
     cy:point[1],
     r:"6",
     fill:"#fff"
   });

   pips.appendChild(pip);

 });

}


showDice(1);


/* =====================================
   ROLL
   ===================================== */

dice.addEventListener("click",rollDice);


function rollDice(){

 if(rolling)return;

 if(diceValue!==0)return;

 rolling=true;

 let count=0;

 const animation=setInterval(()=>{

   const random=1+Math.floor(Math.random()*6);

   showDice(random);

   count++;

   if(count>=10){

     clearInterval(animation);

     diceValue=1+Math.floor(Math.random()*6);

     showDice(diceValue);

     rolling=false;

     afterRoll();

   }

 },70);

}


/* =====================================
   AFTER ROLL
   ===================================== */

function afterRoll(){

 const possible=tokens.some(t=>selectable(t));

 drawTokens();


 if(!possible){

   showMessage(
     diceValue===6
     ?"6 आया — कोई चाल नहीं"
     :"कोई चाल उपलब्ध नहीं"
   );


   setTimeout(()=>{

     if(diceValue!==6){

       nextTurn();

     }else{

       diceValue=0;
       updateTurn();

     }

   },800);

   return;

 }


 updateTurn(
   diceValue===6
   ?"6 आया • Token चुनें"
   :"Token चुनें"
 );

}


/* =====================================
   MOVE TOKEN
   ===================================== */

function moveToken(token){

 const roll=diceValue;

 if(!canMove(token,roll))return;


 /* BASE TO START */

 if(token.progress===-1){

   token.progress=0;

 }else{

   token.progress+=roll;

 }


 /* FINISH */

 if(token.progress===78){

   token.finished=true;

 }


 /* CAPTURE */

 capture(token);


 drawTokens();


 diceValue=0;


 /* TEAM WIN */

 if(teamFinished(players[currentPlayer].team)){

   showMessage(
     "🏆 TEAM "+(players[currentPlayer].team+1)+" WINS!"
   );

   updateTurn("🏆 Team जीत गई");

   return;

 }


 /* SIX = EXTRA TURN */

 if(roll===6){

   showMessage("6! फिर से चाल");

   setTimeout(()=>{

     hideMessage();

     updateTurn();

   },650);

 }else{

   nextTurn();

 }

}


/* =====================================
   CAPTURE
   ===================================== */

function capture(moved){

 const position=globalPosition(moved);

 if(position===null)return;

 if(safe.includes(position))return;


 tokens.forEach(other=>{

   if(other===moved)return;

   if(other.finished)return;

   if(other.progress<0)return;

   if(other.progress>=72)return;


   /* PARTNER को नहीं काटना */

   if(
     players[other.player].team===
     players[moved.player].team
   ){
     return;
   }


   if(globalPosition(other)===position){

     other.progress=-1;

     other.finished=false;

     showMessage("⚡ Token कट गया!");

   }

 });

}


/* =====================================
   NEXT TURN
   ===================================== */

function nextTurn(){

 diceValue=0;

 currentPlayer++;

 if(currentPlayer>=6){
   currentPlayer=0;
 }

 updateTurn();

 drawTokens();

}


/* =====================================
   TURN TEXT
   ===================================== */

function updateTurn(custom){

 const player=players[currentPlayer];

 let text=
   custom ||
   player.name+" की बारी • Dice दबाएँ";


 if(ownFinished(currentPlayer)){

   text+=" • Partner "+
   players[partner[currentPlayer]].name+
   " unlocked";

 }


 turnBox.textContent=text;

}


/* =====================================
   MESSAGE
   ===================================== */

let noticeTimer=null;


function showMessage(text){

 notice.textContent=text;

 notice.classList.add("show");

 clearTimeout(noticeTimer);

 noticeTimer=setTimeout(()=>{

   hideMessage();

 },900);

}


function hideMessage(){

 notice.classList.remove("show");

}


/* =====================================
   START
   ===================================== */

drawTokens();

updateTurn();


/* RESET FOR TESTING */

window.BHAICHARA_RESET=function(){

 tokens.forEach(token=>{

   token.progress=-1;

   token.finished=false;

 });

 currentPlayer=0;

 diceValue=0;

 showDice(1);

 drawTokens();

 updateTurn();

};

</script>

</body>
</html>
