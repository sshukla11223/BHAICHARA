<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>BHAICHARA</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 45%,#163b50 0%,#07141f 48%,#02070c 100%);
  font-family:Arial,Helvetica,sans-serif;
}

body{
  display:flex;
  justify-content:center;
  align-items:center;
}

.game{
  position:relative;
  width:min(97vw,97vh,1000px);
  height:min(97vw,97vh,1000px);
}

.logo{
  position:absolute;
  top:7px;
  left:18px;
  z-index:50;
  color:#fff;
  font-size:clamp(18px,4vw,32px);
  font-weight:1000;
  letter-spacing:4px;
  text-shadow:0 4px 10px #000;
}

.online{
  position:absolute;
  right:18px;
  top:10px;
  z-index:50;
  padding:7px 15px;
  border:1px solid #45ff9b;
  border-radius:30px;
  color:#5cffad;
  background:#03120ddd;
  font-size:11px;
  font-weight:900;
}

.online i{
  display:inline-block;
  width:8px;
  height:8px;
  margin-right:6px;
  border-radius:50%;
  background:#46ff9b;
  box-shadow:0 0 10px #46ff9b;
}

svg{
  position:absolute;
  width:100%;
  height:100%;
  left:0;
  top:0;
  overflow:visible;
}

.cell{
  stroke:#102431;
  stroke-width:2;
}

.token{
  cursor:pointer;
}

.selectable{
  animation:pulse .7s infinite alternate;
}

@keyframes pulse{
  from{
    filter:drop-shadow(0 0 3px white);
  }
  to{
    filter:drop-shadow(0 0 16px white);
  }
}

.turn{
  position:absolute;
  bottom:8px;
  left:50%;
  transform:translateX(-50%);
  z-index:50;
  padding:8px 17px;
  border:1px solid #ffffff35;
  border-radius:30px;
  background:#020911e8;
  color:#fff;
  font-size:12px;
  font-weight:800;
  white-space:nowrap;
}

.notice{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  z-index:100;
  padding:12px 24px;
  border:1px solid #ffffff44;
  border-radius:16px;
  background:#020911ef;
  color:#fff;
  font-weight:900;
  opacity:0;
  pointer-events:none;
  transition:.2s;
}

.notice.show{
  opacity:1;
}

#dice{
  cursor:pointer;
}
</style>
</head>

<body>

<div class="game">

<div class="logo">BHAICHARA</div>

<div class="online">
<i></i>ONLINE
</div>

<svg viewBox="0 0 1000 1000">

<defs>

<linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#82510d"/>
<stop offset=".25" stop-color="#d89a25"/>
<stop offset=".5" stop-color="#ffe58a"/>
<stop offset=".75" stop-color="#d28d1c"/>
<stop offset="1" stop-color="#77480b"/>
</linearGradient>

<radialGradient id="blueToken">
<stop offset="0" stop-color="#63c9ff"/>
<stop offset=".6" stop-color="#168bea"/>
<stop offset="1" stop-color="#03477c"/>
</radialGradient>

<radialGradient id="yellowToken">
<stop offset="0" stop-color="#fff77b"/>
<stop offset=".6" stop-color="#edc500"/>
<stop offset="1" stop-color="#866300"/>
</radialGradient>

<radialGradient id="purpleToken">
<stop offset="0" stop-color="#e8a0ff"/>
<stop offset=".6" stop-color="#9136c8"/>
<stop offset="1" stop-color="#4b126e"/>
</radialGradient>

<radialGradient id="redToken">
<stop offset="0" stop-color="#ff8585"/>
<stop offset=".6" stop-color="#dc3030"/>
<stop offset="1" stop-color="#711010"/>
</radialGradient>

<radialGradient id="greenToken">
<stop offset="0" stop-color="#7affaa"/>
<stop offset=".6" stop-color="#19aa59"/>
<stop offset="1" stop-color="#075b2d"/>
</radialGradient>

<radialGradient id="orangeToken">
<stop offset="0" stop-color="#ffc47e"/>
<stop offset=".6" stop-color="#ef751b"/>
<stop offset="1" stop-color="#873500"/>
</radialGradient>

<filter id="boardShadow">
<feDropShadow dx="0" dy="12" stdDeviation="12"
flood-color="#000" flood-opacity=".75"/>
</filter>

<filter id="tokenShadow">
<feDropShadow dx="0" dy="4" stdDeviation="3"
flood-color="#000" flood-opacity=".7"/>
</filter>

</defs>


<!-- OUTER FRAME -->

<circle
cx="500"
cy="500"
r="470"
fill="#020b12"
stroke="url(#gold)"
stroke-width="20"
filter="url(#boardShadow)"
/>

<circle
cx="500"
cy="500"
r="442"
fill="#0a2433"
stroke="#315268"
stroke-width="5"
/>

<circle
cx="500"
cy="500"
r="420"
fill="none"
stroke="#06131d"
stroke-width="18"
/>


<!-- HOMES -->

<g id="homes"></g>


<!-- TRACK BACKING -->

<circle
cx="500"
cy="500"
r="335"
fill="none"
stroke="#06121b"
stroke-width="108"
/>

<circle
cx="500"
cy="500"
r="335"
fill="none"
stroke="#203b4a"
stroke-width="4"
/>


<!-- TRACK -->

<g id="track"></g>


<!-- SAFE STARS -->

<g id="safe"></g>


<!-- HOME LANES -->

<g id="lanes"></g>


<!-- CENTER -->

<polygon
points="500,358 628,432 628,568 500,642 372,568 372,432"
fill="#030b12"
stroke="url(#gold)"
stroke-width="11"
filter="url(#boardShadow)"
/>

<polygon
points="500,386 598,443 598,557 500,614 402,557 402,443"
fill="#1478d1"
stroke="#80d3ff"
stroke-width="4"
/>

<polygon
points="500,411 575,455 575,545 500,589 425,545 425,455"
fill="#1b82db"
stroke="#a5ddff"
stroke-width="2"
/>


<!-- DICE -->

<g id="dice" transform="translate(500 500)">

<polygon
points="0,-52 45,-26 45,26 0,52 -45,26 -45,-26"
fill="#0e70c9"
stroke="#d0edff"
stroke-width="4"
/>

<g id="pips"></g>

</g>


<!-- TOKENS -->

<g id="tokens"></g>

</svg>


<div id="notice" class="notice"></div>

<div id="turn" class="turn">
P1 की बारी • Dice दबाएँ
</div>

</div>


<script>

/* ==========================================
   BHAICHARA V2
   ========================================== */

const NS="http://www.w3.org/2000/svg";

const homes=document.getElementById("homes");
const track=document.getElementById("track");
const safeLayer=document.getElementById("safe");
const lanes=document.getElementById("lanes");
const tokensLayer=document.getElementById("tokens");
const pips=document.getElementById("pips");
const dice=document.getElementById("dice");

const turnBox=document.getElementById("turn");
const notice=document.getElementById("notice");


/* PLAYERS */

const players=[
{
 id:0,
 name:"P1",
 color:"#168bea",
 gradient:"url(#blueToken)",
 team:0
},
{
 id:1,
 name:"P2",
 color:"#f1c900",
 gradient:"url(#yellowToken)",
 team:1
},
{
 id:2,
 name:"P3",
 color:"#8a32c5",
 gradient:"url(#purpleToken)",
 team:2
},
{
 id:3,
 name:"P4",
 color:"#dd3030",
 gradient:"url(#redToken)",
 team:0
},
{
 id:4,
 name:"P5",
 color:"#19aa59",
 gradient:"url(#greenToken)",
 team:1
},
{
 id:5,
 name:"P6",
 color:"#ef751b",
 gradient:"url(#orangeToken)",
 team:2
}
];


/* PARTNERS */

const partner={
0:3,
3:0,
1:4,
4:1,
2:5,
5:2
};


/* BOARD */

const CX=500;
const CY=500;

const PATH_R=335;

const CELLS=72;

const starts=[0,12,24,36,48,60];

const homeAngles=[
-90,
-30,
30,
90,
150,
210
];


/* ==========================================
   HELPERS
   ========================================== */

function el(tag,attrs={}){

 const e=document.createElementNS(NS,tag);

 for(const key in attrs){
   e.setAttribute(key,attrs[key]);
 }

 return e;
}


function polar(radius,angle){

 const r=(angle-90)*Math.PI/180;

 return[
   CX+radius*Math.cos(r),
   CY+radius*Math.sin(r)
 ];

}


function pathPoint(index){

 index=((index%CELLS)+CELLS)%CELLS;

 return polar(PATH_R,index*360/CELLS);

}


/* ==========================================
   HOME AREAS
   ========================================== */

players.forEach((p,i)=>{

 const angle=homeAngles[i];

 const a=polar(435,angle-24);
 const b=polar(435,angle+24);

 const home=el("polygon",{
   points:
   `${CX},${CY} ${a[0]},${a[1]} ${b[0]},${b[1]}`,
   fill:p.color,
   opacity:"0.88",
   stroke:"#07131d",
   "stroke-width":"7"
 });

 homes.appendChild(home);


 /* INNER HOME */

 const c=polar(386,angle);

 const homeCircle=el("circle",{
   cx:c[0],
   cy:c[1],
   r:72,
   fill:"#03101a",
   stroke:"#ffffff35",
   "stroke-width":"4"
 });

 homes.appendChild(homeCircle);


 /* HOME LABEL */

 const label=el("text",{
   x:c[0],
   y:c[1]-92,
   fill:"#fff",
   "font-size":"21",
   "font-weight":"900",
   "text-anchor":"middle"
 });

 label.textContent=p.name;

 homes.appendChild(label);

});


/* ==========================================
   TRACK CELLS
   ========================================== */

for(let i=0;i<CELLS;i++){

 const pos=pathPoint(i);

 const playerIndex=starts.indexOf(i);

 let fill="#edf3f5";

 if(playerIndex!==-1){
   fill=players[playerIndex].color;
 }

 const cell=el("rect",{
   x:pos[0]-17,
   y:pos[1]-17,
   width:34,
   height:34,
   rx:7,
   fill:fill,
   class:"cell"
 });

 track.appendChild(cell);

}


/* ==========================================
   12 SAFE STARS
   ========================================== */

const safe=[];

for(let i=0;i<6;i++){

 safe.push(starts[i]);

 safe.push((starts[i]+6)%CELLS);

}

safe.forEach(index=>{

 const pos=pathPoint(index);

 const star=el("text",{
   x:pos[0],
   y:pos[1]+8,
   fill:"#ffd84d",
   "font-size":"25",
   "font-weight":"900",
   "text-anchor":"middle",
   "pointer-events":"none"
 });

 star.textContent="★";

 safeLayer.appendChild(star);

});


/* ==========================================
   COLORED HOME LANES
   ========================================== */

players.forEach((p,i)=>{

 const angle=homeAngles[i];

 for(let step=0;step<6;step++){

   const radius=285-(step*28);

   const pos=polar(radius,angle);

   const cell=el("rect",{
     x:pos[0]-16,
     y:pos[1]-16,
     width:32,
     height:32,
     rx:6,
     fill:p.color,
     opacity:.9,
     stroke:"#07131d",
     "stroke-width":2
   });

   lanes.appendChild(cell);

 }

});


/* ==========================================
   TOKEN HOME POSITIONS
   ========================================== */

const homePositions={};

players.forEach((p,i)=>{

 const center=polar(386,homeAngles[i]);

 homePositions[p.id]=[

   [center[0]-28,center[1]-28],

   [center[0]+28,center[1]-28],

   [center[0]-28,center[1]+28],

   [center[0]+28,center[1]+28]

 ];

});


/* ==========================================
   TOKENS
   ========================================== */

const tokens=[];

for(let p=0;p<6;p++){

 for(let n=0;n<4;n++){

   tokens.push({

     id:p+"-"+n,

     player:p,

     number:n,

     progress:-1,

     finished:false,

     node:null

   });

 }

}


/* ==========================================
   POSITION
   ========================================== */

function globalPosition(token){

 if(token.progress<0)return null;

 if(token.progress>=72)return null;

 return(
   starts[token.player]+token.progress
 )%CELLS;

}


function tokenPosition(token){

 if(token.progress===-1){

   return homePositions[token.player][token.number];

 }


 if(token.progress>=72){

   const angle=homeAngles[token.player];

   const lane=token.progress-72;

   return polar(285-lane*28,angle);

 }


 return pathPoint(globalPosition(token));

}


/* ==========================================
   DRAW TOKEN
   ========================================== */

function drawTokens(){

 tokensLayer.innerHTML="";

 tokens.forEach(token=>{

   const p=players[token.player];

   const pos=tokenPosition(token);

   const group=el("g",{
     class:"token",
     transform:
     `translate(${pos[0]},${pos[1]})`
   });


   if(selectable(token)){
     group.classList.add("selectable");
   }


   const shadow=el("circle",{
     cx:3,
     cy:5,
     r:15,
     fill:"#000",
     opacity:.55
   });


   const outer=el("circle",{
     cx:0,
     cy:0,
     r:14,
     fill:p.gradient,
     stroke:"#07131d",
     "stroke-width":2
   });


   const ring=el("circle",{
     cx:0,
     cy:0,
     r:10,
     fill:"none",
     stroke:"#fff",
     "stroke-width":1.5,
     opacity:.5
   });


   const shine=el("circle",{
     cx:-4,
     cy:-5,
     r:3,
     fill:"#fff",
     opacity:.7
   });


   group.appendChild(shadow);
   group.appendChild(outer);
   group.appendChild(ring);
   group.appendChild(shine);


   group.addEventListener("click",()=>{

     if(selectable(token)){
       moveToken(token);
     }

   });


   tokensLayer.appendChild(group);

   token.node=group;

 });

}


/* ==========================================
   GAME
   ========================================== */

let currentPlayer=0;

let diceValue=0;

let rolling=false;


function ownFinished(player){

 return tokens.filter(t=>
   t.player===player &&
   t.finished
 ).length===4;

}


function teamFinished(team){

 return tokens.filter(t=>
   players[t.player].team===team &&
   t.finished
 ).length===8;

}


function controllable(player){

 const result=[player];

 if(ownFinished(player)){
   result.push(partner[player]);
 }

 return result;

}


function canMove(token,roll){

 if(token.finished)return false;

 if(token.progress===-1){

   return roll===6;

 }

 return token.progress+roll<=78;

}


function selectable(token){

 if(rolling)return false;

 if(diceValue===0)return false;

 if(!controllable(currentPlayer).includes(token.player))
   return false;

 return canMove(token,diceValue);

}


/* ==========================================
   DICE
   ========================================== */

function showDice(n){

 pips.innerHTML="";

 const patterns={

 1:[[0,0]],

 2:[[-18,-18],[18,18]],

 3:[[-18,-18],[0,0],[18,18]],

 4:[
 [-18,-18],
 [18,-18],
 [-18,18],
 [18,18]
 ],

 5:[
 [-18,-18],
 [18,-18],
 [0,0],
 [-18,18],
 [18,18]
 ],

 6:[
 [-18,-20],
 [18,-20],
 [-18,0],
 [18,0],
 [-18,20],
 [18,20]
 ]

 };


 patterns[n].forEach(pt=>{

   const pip=el("circle",{
     cx:pt[0],
     cy:pt[1],
     r:5.5,
     fill:"#fff"
   });

   pips.appendChild(pip);

 });

}


showDice(1);


/* ==========================================
   ROLL DICE
   ========================================== */

dice.addEventListener("click",rollDice);


function rollDice(){

 if(rolling)return;

 if(diceValue!==0)return;

 rolling=true;

 let count=0;

 const timer=setInterval(()=>{

   showDice(
     1+Math.floor(Math.random()*6)
   );

   count++;

   if(count>=9){

     clearInterval(timer);

     diceValue=
       1+Math.floor(Math.random()*6);

     showDice(diceValue);

     rolling=false;

     afterRoll();

   }

 },75);

}


/* ==========================================
   AFTER ROLL
   ========================================== */

function afterRoll(){

 drawTokens();

 const possible=tokens.some(
   token=>selectable(token)
 );


 if(!possible){

   showMessage(
     diceValue===6
     ?"6 आया • कोई चाल नहीं"
     :"कोई चाल उपलब्ध नहीं"
   );


   setTimeout(()=>{

     if(diceValue===6){

       diceValue=0;

       updateTurn();

     }else{

       nextTurn();

     }

   },850);

   return;

 }


 updateTurn(
   diceValue===6
   ?"6 आया • Token चुनें"
   :"Token चुनें"
 );

}


/* ==========================================
   MOVE
   ========================================== */

function moveToken(token){

 const roll=diceValue;

 if(!canMove(token,roll))return;


 if(token.progress===-1){

   token.progress=0;

 }else{

   token.progress+=roll;

 }


 if(token.progress===78){

   token.finished=true;

 }


 capture(token);

 drawTokens();

 diceValue=0;


 if(teamFinished(players[currentPlayer].team)){

   showMessage(
     "🏆 TEAM "+(players[currentPlayer].team+1)+" WINS"
   );

   updateTurn("🏆 Team जीत गई");

   return;

 }


 if(roll===6){

   showMessage("6! फिर से चाल");

   setTimeout(()=>{

     hideMessage();

     updateTurn();

   },650);

 }else{

   nextTurn();

 }

}


/* ==========================================
   CAPTURE
   ========================================== */

function capture(moved){

 const pos=globalPosition(moved);

 if(pos===null)return;

 if(safe.includes(pos))return;


 tokens.forEach(other=>{

   if(other===moved)return;

   if(other.finished)return;

   if(other.progress<0)return;

   if(other.progress>=72)return;


   /* PARTNER SAFE */

   if(
     players[other.player].team===
     players[moved.player].team
   ){

     return;

   }


   if(globalPosition(other)===pos){

     other.progress=-1;

     other.finished=false;

     showMessage("⚡ Token कट गया!");

   }

 });

}


/* ==========================================
   NEXT PLAYER
   ========================================== */

function nextTurn(){

 diceValue=0;

 currentPlayer++;

 if(currentPlayer>=6){

   currentPlayer=0;

 }

 drawTokens();

 updateTurn();

}


/* ==========================================
   TURN DISPLAY
   ========================================== */

function updateTurn(custom){

 const p=players[currentPlayer];

 let text=
   custom ||
   p.name+" की बारी • Dice दबाएँ";


 if(ownFinished(currentPlayer)){

   text+=
   " • Partner "+
   players[partner[currentPlayer]].name+
   " unlocked";

 }


 turnBox.textContent=text;

}


/* ==========================================
   MESSAGE
   ========================================== */

let noticeTimer;


function showMessage(text){

 notice.textContent=text;

 notice.classList.add("show");

 clearTimeout(noticeTimer);

 noticeTimer=setTimeout(
   hideMessage,
   900
 );

}


function hideMessage(){

 notice.classList.remove("show");

}


/* ==========================================
   START
   ========================================== */

drawTokens();

updateTurn();


/* RESET */

window.BHAICHARA_RESET=function(){

 tokens.forEach(token=>{

   token.progress=-1;

   token.finished=false;

 });

 currentPlayer=0;

 diceValue=0;

 showDice(1);

 drawTokens();

 updateTurn();

};

</script>

</body>
</html>
