<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>BHAICHARA</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  touch-action:manipulation;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#02070d;
  font-family:Arial,Helvetica,sans-serif;
}

#app{
  width:100vw;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  position:relative;
}

canvas{
  display:block;
  width:min(100vw,100vh);
  height:min(100vw,100vh);
}

.title{
  position:absolute;
  top:10px;
  left:18px;
  color:#fff;
  font-size:clamp(22px,4vw,36px);
  font-weight:900;
  letter-spacing:3px;
  z-index:10;
  text-shadow:0 3px 8px #000;
}

.online{
  position:absolute;
  top:12px;
  right:16px;
  color:#50ff9d;
  border:1px solid #50ff9d;
  border-radius:25px;
  padding:7px 14px;
  font-size:13px;
  font-weight:bold;
  background:#06130de8;
  z-index:10;
}

.online i{
  display:inline-block;
  width:8px;
  height:8px;
  border-radius:50%;
  background:#50ff9d;
  box-shadow:0 0 9px #50ff9d;
  margin-right:5px;
}

.status{
  position:absolute;
  bottom:8px;
  left:50%;
  transform:translateX(-50%);
  color:white;
  background:#050b11ed;
  border:1px solid #ffffff30;
  border-radius:20px;
  padding:8px 18px;
  font-size:12px;
  font-weight:bold;
  z-index:10;
  white-space:nowrap;
}
</style>
</head>

<body>

<div id="app">

<canvas id="board"></canvas>

<div class="title">BHAICHARA</div>

<div class="online">
  <i></i>ONLINE
</div>

<div class="status" id="status">
  P1 की बारी • Dice दबाएँ
</div>

</div>

<script>

const canvas=document.getElementById("board");
const ctx=canvas.getContext("2d");

let W=0;
let H=0;
let S=0;
let CX=0;
let CY=0;

const COLORS=[
  {
    id:"P1",
    color:"#087BEF",
    light:"#45B5FF",
    dark:"#034B9A",
    angle:-30
  },
  {
    id:"P2",
    color:"#F0C400",
    light:"#FFE45A",
    dark:"#A57E00",
    angle:-90
  },
  {
    id:"P3",
    color:"#8526C7",
    light:"#C15BFF",
    dark:"#50157D",
    angle:-150
  },
  {
    id:"P4",
    color:"#E52C32",
    light:"#FF686D",
    dark:"#8D161B",
    angle:150
  },
  {
    id:"P5",
    color:"#0AA956",
    light:"#45E681",
    dark:"#056A37",
    angle:90
  },
  {
    id:"P6",
    color:"#EF7418",
    light:"#FFAA5C",
    dark:"#98460C",
    angle:30
  }
];

function resize(){

  const dpr=Math.min(window.devicePixelRatio||1,2);

  S=Math.min(window.innerWidth,window.innerHeight);

  W=S;
  H=S;

  canvas.width=S*dpr;
  canvas.height=S*dpr;

  canvas.style.width=S+"px";
  canvas.style.height=S+"px";

  ctx.setTransform(dpr,0,0,dpr,0,0);

  CX=S/2;
  CY=S/2;

  draw();
}

window.addEventListener("resize",resize);


/* =========================
   BASIC HELPERS
========================= */

function rad(deg){
  return deg*Math.PI/180;
}

function point(r,a){

  const t=rad(a-90);

  return {
    x:CX+Math.cos(t)*r,
    y:CY+Math.sin(t)*r
  };
}

function polygon(points,fill,stroke="#07131d",lw=2){

  ctx.beginPath();

  points.forEach((p,i)=>{
    if(i===0)ctx.moveTo(p.x,p.y);
    else ctx.lineTo(p.x,p.y);
  });

  ctx.closePath();

  ctx.fillStyle=fill;
  ctx.fill();

  if(stroke){
    ctx.strokeStyle=stroke;
    ctx.lineWidth=lw;
    ctx.stroke();
  }
}

function roundRect(x,y,w,h,r,fill,stroke){

  ctx.beginPath();

  ctx.roundRect(x,y,w,h,r);

  ctx.fillStyle=fill;
  ctx.fill();

  if(stroke){
    ctx.strokeStyle=stroke;
    ctx.lineWidth=1;
    ctx.stroke();
  }
}


/* =========================
   BACKGROUND
========================= */

function background(){

  const g=ctx.createRadialGradient(
    CX,CY,S*.08,
    CX,CY,S*.72
  );

  g.addColorStop(0,"#102b3a");
  g.addColorStop(.55,"#071722");
  g.addColorStop(1,"#010509");

  ctx.fillStyle=g;
  ctx.fillRect(0,0,S,S);

  /* subtle pattern */

  ctx.globalAlpha=.12;

  for(let x=0;x<S;x+=35){

    for(let y=0;y<S;y+=35){

      ctx.beginPath();

      ctx.arc(x,y,1,0,Math.PI*2);

      ctx.fillStyle="#77A0B8";
      ctx.fill();
    }
  }

  ctx.globalAlpha=1;
}


/* =========================
   OUTER BOARD
========================= */

function outerBoard(){

  const r=S*.465;

  ctx.save();

  ctx.shadowColor="#000";
  ctx.shadowBlur=S*.025;

  ctx.beginPath();
  ctx.arc(CX,CY,r,0,Math.PI*2);

  ctx.fillStyle="#07141e";
  ctx.fill();

  const gold=ctx.createLinearGradient(
    CX-r,CY-r,
    CX+r,CY+r
  );

  gold.addColorStop(0,"#6f430b");
  gold.addColorStop(.2,"#e5a52a");
  gold.addColorStop(.48,"#ffe88a");
  gold.addColorStop(.7,"#d18c1b");
  gold.addColorStop(1,"#71440b");

  ctx.strokeStyle=gold;
  ctx.lineWidth=S*.014;
  ctx.stroke();

  ctx.restore();

  ctx.beginPath();
  ctx.arc(CX,CY,r*.95,0,Math.PI*2);

  ctx.strokeStyle="#35596d";
  ctx.lineWidth=S*.005;
  ctx.stroke();
}


/* =========================
   SIX HOME AREAS
========================= */

function homeArea(player){

  const outer=S*.395;
  const inner=S*.115;

  const spread=27;

  const p1=point(inner,player.angle-spread);
  const p2=point(outer,player.angle-spread);
  const p3=point(outer,player.angle+spread);
  const p4=point(inner,player.angle+spread);

  const grad=ctx.createLinearGradient(
    p2.x,p2.y,
    p3.x,p3.y
  );

  grad.addColorStop(0,player.light);
  grad.addColorStop(.48,player.color);
  grad.addColorStop(1,player.dark);

  polygon(
    [p1,p2,p3,p4],
    grad,
    "#061019",
    S*.006
  );

  /* inner highlight */

  const q1=point(S*.135,player.angle-spread+3);
  const q2=point(S*.365,player.angle-spread+3);
  const q3=point(S*.365,player.angle+spread-3);
  const q4=point(S*.135,player.angle+spread-3);

  polygon(
    [q1,q2,q3,q4],
    player.color,
    "#ffffff15",
    1
  );
}


/* =========================
   HOME LANES
========================= */

function homeLane(player){

  /*
     6 colored cells running
     from home towards center
  */

  for(let i=1;i<=6;i++){

    const r=S*.265-i*S*.026;

    const p=point(r,player.angle);

    const cell=S*.027;

    roundRect(
      p.x-cell/2,
      p.y-cell/2,
      cell,
      cell,
      cell*.12,
      player.color,
      "#07131d"
    );
  }
}


/* =========================
   TRACK
========================= */

const TRACK_COUNT=72;

function trackPoint(index){

  /*
    Hexagon-like circular route.
    This makes the path look like
    the reference rather than a
    perfect circle.
  */

  const side=index%12;

  const section=Math.floor(index/12);

  const a1=section*60-30;
  const a2=a1+60;

  const t=side/12;

  const p1=point(S*.335,a1);
  const p2=point(S*.335,a2);

  return {
    x:p1.x+(p2.x-p1.x)*t,
    y:p1.y+(p2.y-p1.y)*t
  };
}


/* =========================
   TRACK CELLS
========================= */

function drawTrack(){

  const cell=S*.031;

  for(let i=0;i<TRACK_COUNT;i++){

    const p=trackPoint(i);

    let startPlayer=-1;

    for(let j=0;j<6;j++){

      if(i===j*12){
        startPlayer=j;
        break;
      }
    }

    let fill="#F2F6F7";

    if(startPlayer>=0){
      fill=COLORS[startPlayer].color;
    }

    roundRect(
      p.x-cell/2,
      p.y-cell/2,
      cell,
      cell,
      cell*.15,
      fill,
      "#25343D"
    );

    if(startPlayer<0){

      ctx.beginPath();

      ctx.moveTo(
        p.x-cell*.25,
        p.y-cell*.25
      );

      ctx.lineTo(
        p.x+cell*.25,
        p.y-cell*.25
      );

      ctx.strokeStyle="#ffffff";
      ctx.globalAlpha=.35;
      ctx.lineWidth=1;
      ctx.stroke();
      ctx.globalAlpha=1;
    }
  }
}


/* =========================
   STARS
========================= */

function drawStar(x,y,r){

  ctx.save();

  ctx.translate(x,y);

  ctx.beginPath();

  for(let i=0;i<10;i++){

    const rr=i%2===0?r:r*.43;

    const a=-Math.PI/2+i*Math.PI/5;

    const px=Math.cos(a)*rr;
    const py=Math.sin(a)*rr;

    if(i===0)
      ctx.moveTo(px,py);
    else
      ctx.lineTo(px,py);
  }

  ctx.closePath();

  ctx.fillStyle="#FFD83D";
  ctx.shadowColor="#FFD83D";
  ctx.shadowBlur=r*.8;
  ctx.fill();

  ctx.restore();
}

function safeSpots(){

  /*
     Exactly 12 stars.
     Two per player.
  */

  for(let p=0;p<6;p++){

    [p*12+3,p*12+9].forEach(index=>{

      const q=trackPoint(index);

      drawStar(
        q.x,
        q.y,
        S*.010
      );
    });
  }
}


/* =========================
   PLAYER BASE
========================= */

function token(x,y,player,r){

  ctx.save();

  ctx.shadowColor="#000";
  ctx.shadowBlur=r*.7;
  ctx.shadowOffsetY=r*.25;

  const g=ctx.createRadialGradient(
    x-r*.35,
    y-r*.4,
    r*.05,
    x,
    y,
    r
  );

  g.addColorStop(0,"#fff");
  g.addColorStop(.12,player.light);
  g.addColorStop(.55,player.color);
  g.addColorStop(1,player.dark);

  ctx.beginPath();

  ctx.arc(
    x,
    y,
    r,
    0,
    Math.PI*2
  );

  ctx.fillStyle=g;
  ctx.fill();

  ctx.restore();

  ctx.beginPath();

  ctx.arc(
    x,
    y,
    r*.65,
    0,
    Math.PI*2
  );

  ctx.strokeStyle="#fff";
  ctx.lineWidth=Math.max(1,r*.09);
  ctx.stroke();
}


function playerBase(player){

  const p=point(S*.425,player.angle);

  const baseR=S*.055;

  ctx.save();

  ctx.shadowColor="#000";
  ctx.shadowBlur=S*.015;

  ctx.beginPath();

  ctx.arc(
    p.x,
    p.y,
    baseR,
    0,
    Math.PI*2
  );

  ctx.fillStyle="#030a10";
  ctx.fill();

  ctx.strokeStyle="#ffffff25";
  ctx.lineWidth=2;
  ctx.stroke();

  ctx.restore();

  const gap=S*.022;
  const tr=S*.019;

  token(
    p.x-gap,
    p.y-gap,
    player,
    tr
  );

  token(
    p.x+gap,
    p.y-gap,
    player,
    tr
  );

  token(
    p.x-gap,
    p.y+gap,
    player,
    tr
  );

  token(
    p.x+gap,
    p.y+gap,
    player,
    tr
  );

  /* player label */

  const label=point(
    S*.455,
    player.angle
  );

  ctx.fillStyle="#fff";

  ctx.font=`900 ${Math.max(12,S*.020)}px Arial`;

  ctx.textAlign="center";
  ctx.textBaseline="middle";

  ctx.fillText(
    player.id,
    label.x,
    label.y
  );
}


/* =========================
   CENTER
========================= */

function hexagon(x,y,r,fill,stroke,lw){

  ctx.beginPath();

  for(let i=0;i<6;i++){

    const a=rad(i*60-30);

    const px=x+Math.cos(a)*r;
    const py=y+Math.sin(a)*r;

    if(i===0)
      ctx.moveTo(px,py);
    else
      ctx.lineTo(px,py);
  }

  ctx.closePath();

  ctx.fillStyle=fill;
  ctx.fill();

  ctx.strokeStyle=stroke;
  ctx.lineWidth=lw;
  ctx.stroke();
}


function centerDice(){

  const r=S*.095;

  /* black/gold outer */

  hexagon(
    CX,
    CY,
    r,
    "#050b10",
    "#F1B83D",
    S*.007
  );

  /* blue inner */

  hexagon(
    CX,
    CY,
    r*.78,
    "#087CDC",
    "#5EC8FF",
    S*.004
  );

  /* blue glow */

  ctx.beginPath();

  ctx.arc(
    CX,
    CY,
    r*.51,
    0,
    Math.PI*2
  );

  const g=ctx.createRadialGradient(
    CX-r*.15,
    CY-r*.2,
    2,
    CX,
    CY,
    r*.55
  );

  g.addColorStop(0,"#62CFFF");
  g.addColorStop(.5,"#087EDC");
  g.addColorStop(1,"#034274");

  ctx.fillStyle=g;
  ctx.fill();

  ctx.strokeStyle="#9AE1FF";
  ctx.lineWidth=2;
  ctx.stroke();

  drawDice();
}


/* =========================
   DICE
========================= */

let diceValue=6;

function drawDice(){

  const r=S*.042;

  ctx.save();

  ctx.shadowColor="#000";
  ctx.shadowBlur=S*.012;
  ctx.shadowOffsetY=S*.006;

  roundRect(
    CX-r,
    CY-r,
    r*2,
    r*2,
    r*.18,
    "#F7F8F8",
    "#CBD7DB"
  );

  ctx.restore();

  const spots={
    1:[[0,0]],

    2:[
      [-.32,-.32],
      [.32,.32]
    ],

    3:[
      [-.32,-.32],
      [0,0],
      [.32,.32]
    ],

    4:[
      [-.32,-.32],
      [.32,-.32],
      [-.32,.32],
      [.32,.32]
    ],

    5:[
      [-.32,-.32],
      [.32,-.32],
      [0,0],
      [-.32,.32],
      [.32,.32]
    ],

    6:[
      [-.32,-.32],
      [.32,-.32],
      [-.32,0],
      [.32,0],
      [-.32,.32],
      [.32,.32]
    ]
  };

  spots[diceValue].forEach(s=>{

    ctx.beginPath();

    ctx.arc(
      CX+s[0]*r*1.45,
      CY+s[1]*r*1.45,
      r*.095,
      0,
      Math.PI*2
    );

    ctx.fillStyle="#D9232E";
    ctx.fill();
  });
}


/* =========================
   ARROWS
========================= */

function arrowAt(index,player){

  const p=trackPoint(index);

  ctx.save();

  ctx.translate(p.x,p.y);

  ctx.fillStyle=player.color;

  ctx.beginPath();

  ctx.moveTo(
    S*.009,
    0
  );

  ctx.lineTo(
    -S*.008,
    -S*.006
  );

  ctx.lineTo(
    -S*.003,
    0
  );

  ctx.lineTo(
    -S*.008,
    S*.006
  );

  ctx.closePath();

  ctx.fill();

  ctx.restore();
}

function arrows(){

  for(let i=0;i<6;i++){

    arrowAt(
      i*12+6,
      COLORS[i]
    );
  }
}


/* =========================
   DRAW EVERYTHING
========================= */

function draw(){

  background();

  outerBoard();

  /*
     Homes first
  */

  COLORS.forEach(homeArea);

  /*
     Colored home lanes
  */

  COLORS.forEach(homeLane);

  /*
     Main continuous track
  */

  drawTrack();

  /*
     Safe stars
  */

  safeSpots();

  /*
     Direction arrows
  */

  arrows();

  /*
     Tokens
  */

  COLORS.forEach(playerBase);

  /*
     Center dice
  */

  centerDice();
}


/* =========================
   DICE CLICK
========================= */

canvas.addEventListener("click",(e)=>{

  const rect=canvas.getBoundingClientRect();

  const x=e.clientX-rect.left;
  const y=e.clientY-rect.top;

  const distance=Math.hypot(
    x-CX,
    y-CY
  );

  if(distance<S*.12){

    diceValue=
      Math.floor(Math.random()*6)+1;

    draw();

    document.getElementById("status").textContent=
      `P1 की बारी • ${diceValue} आया • Token चुनें`;
  }
});


resize();

</script>

</body>
</html>
