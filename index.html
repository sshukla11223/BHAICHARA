<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>BHAICHARA — 6 Player Ludo</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,Helvetica,sans-serif;
  background:#070b10;
  color:white;
}

body{
  display:flex;
  justify-content:center;
  align-items:center;
}

.app{
  width:min(100vw,1100px);
  height:100vh;
  display:flex;
  flex-direction:column;
  background:
  radial-gradient(circle at 50% 45%,#182533 0%,#080c11 68%);
}

/* TOP BAR */

.top{
  height:72px;
  min-height:72px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:8px 18px;
  background:linear-gradient(180deg,#111a24ee,#070b10cc);
  border-bottom:1px solid #ffffff18;
  z-index:50;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
}

.menu{
  width:48px;
  height:48px;
  border-radius:50%;
  border:2px solid #715b38;
  background:#0d131a;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:27px;
  box-shadow:0 0 15px #000;
}

.crown{
  font-size:34px;
  filter:drop-shadow(0 3px 5px #000);
}

.title{
  font-size:22px;
  font-weight:900;
  letter-spacing:1px;
}

.online{
  margin-top:3px;
  color:#36ef72;
  font-size:12px;
  font-weight:bold;
}

.actions{
  display:flex;
  gap:9px;
}

.action{
  width:48px;
  height:48px;
  border-radius:50%;
  border:2px solid #66502f;
  background:#111820;
  color:white;
  font-size:22px;
}

/* GAME STAGE */

.stage{
  flex:1;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:8px;
}

/* BOARD */

.board{
  position:relative;
  width:min(94vw,850px);
  aspect-ratio:1;
  border-radius:7%;
  background:#151b21;
  overflow:hidden;

  box-shadow:
  0 0 0 5px #392818,
  0 0 0 9px #a8792d,
  0 25px 70px #000;

  border:5px solid #d09a35;
}

/* GOLDEN INNER FRAME */

.board:after{
  content:"";
  position:absolute;
  inset:10px;
  border:2px solid #f0bd55;
  border-radius:6%;
  pointer-events:none;
  z-index:30;
}

/* HOME AREAS */

.home{
  position:absolute;
  width:39%;
  height:39%;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
  z-index:4;
}

/* RED */

.home.red{
  left:2%;
  top:2%;
  background:linear-gradient(145deg,#ff2631,#9d0009);
  clip-path:polygon(
    0 0,
    100% 0,
    100% 58%,
    58% 100%,
    0 100%
  );
}

/* GREEN */

.home.green{
  right:2%;
  top:2%;
  background:linear-gradient(145deg,#16e56c,#008d3b);
  clip-path:polygon(
    0 0,
    100% 0,
    100% 100%,
    42% 100%,
    0 58%
  );
}

/* ORANGE */

.home.orange{
  right:2%;
  bottom:2%;
  background:linear-gradient(145deg,#ff9b19,#df5800);
  clip-path:polygon(
    42% 0,
    100% 0,
    100% 100%,
    0 100%,
    0 42%
  );
}

/* BLUE */

.home.blue{
  right:30.5%;
  bottom:2%;
  background:linear-gradient(145deg,#1590ff,#0054c6);
  clip-path:polygon(
    42% 0,
    100% 0,
    100% 100%,
    0 100%,
    0 42%
  );
}

/* YELLOW */

.home.yellow{
  left:2%;
  bottom:2%;
  background:linear-gradient(145deg,#ffe51b,#dfa900);
  clip-path:polygon(
    0 42%,
    58% 0,
    100% 0,
    100% 100%,
    0 100%
  );
}

/* PURPLE */

.home.purple{
  left:2%;
  top:30.5%;
  background:linear-gradient(145deg,#9c27ff,#5700b5);
  clip-path:polygon(
    0 0,
    58% 0,
    100% 42%,
    100% 100%,
    0 100%
  );
}

/* HOME TOKEN BOX */

.homebox{
  width:54%;
  height:54%;
  padding:12%;
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12%;

  background:#ffffff12;
  border-radius:22%;

  box-shadow:
  inset 0 0 18px #0005,
  0 7px 15px #0004;
}

/* 24 GOTTIS */

.token{
  width:100%;
  aspect-ratio:1;
  border-radius:50%;
  border:4px solid #ffffffcc;

  box-shadow:
  0 7px 11px #000b,
  0 0 8px #fff4,
  inset 0 4px 5px #fff9;

  position:relative;
}

.token:after{
  content:"";
  position:absolute;
  inset:18%;
  border:2px solid #ffffffb8;
  border-radius:50%;
}

/* COLORS */

.redt{
  background:linear-gradient(145deg,#ff3440,#b7000a);
}

.greent{
  background:linear-gradient(145deg,#18d968,#078d3e);
}

.oranget{
  background:linear-gradient(145deg,#ff9b25,#d85b00);
}

.bluet{
  background:linear-gradient(145deg,#2b9aff,#005aca);
}

.yellowt{
  background:linear-gradient(145deg,#ffe735,#d9a900);
}

.purplet{
  background:linear-gradient(145deg,#a03cff,#6200c0);
}

/* TRACK */

.track{
  position:absolute;
  background:#f5f6f5;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:1px;
  box-shadow:inset 0 0 0 2px #111;
  z-index:6;
}

.track.v{
  width:13%;
  height:38%;
  left:43.5%;
  top:1%;
}

.track.v.bottom{
  top:auto;
  bottom:1%;
}

.track.h{
  height:13%;
  width:38%;
  left:1%;
  top:43.5%;
}

.track.h.right{
  left:auto;
  right:1%;
}

.cell{
  background:#fafafa;
  border:1px solid #858585;
}

.cell.red{
  background:#ed1722;
}

.cell.green{
  background:#0caf4d;
}

.cell.orange{
  background:#f28712;
}

.cell.blue{
  background:#1581e9;
}

.cell.yellow{
  background:#f1c80b;
}

.cell.purple{
  background:#7b18d8;
}

/* SAFE STARS */

.safe{
  position:absolute;
  width:34px;
  height:34px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:23px;
  color:white;
  z-index:14;
  text-shadow:
  0 2px 3px #000,
  0 0 5px #fff;
}

/* 12 STARS */

.s1{left:28%;top:23%}
.s2{left:46%;top:21%}
.s3{right:28%;top:23%}

.s4{right:23%;top:46%}
.s5{right:23%;bottom:30%}
.s6{right:46%;bottom:21%}

.s7{left:28%;bottom:23%}
.s8{left:46%;bottom:21%}
.s9{left:23%;bottom:30%}

.s10{left:23%;top:46%}
.s11{left:31%;top:31%}
.s12{right:31%;bottom:31%}

/* CENTER */

.center{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);

  width:29%;
  aspect-ratio:1;

  border-radius:50%;

  background:
  radial-gradient(
    circle,
    #1978ff 0%,
    #06419c 50%,
    #03152c 72%
  );

  border:8px solid #c78b29;

  box-shadow:
  0 0 0 5px #101419,
  0 0 30px #087bff,
  0 15px 30px #000;

  display:flex;
  align-items:center;
  justify-content:center;

  z-index:25;
}

/* DICE */

.dice{
  width:48%;
  aspect-ratio:1;

  border-radius:20%;

  background:
  linear-gradient(145deg,#ffffff,#d4d8df);

  color:#111;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:clamp(38px,7vw,65px);

  box-shadow:
  0 8px 15px #0009,
  inset 0 2px 4px #fff;

  cursor:pointer;
  user-select:none;

  transition:.15s;
}

.dice:active{
  transform:scale(.90);
}

/* MOVING GOTTIS */

.moving{
  position:absolute;
  width:42px;
  height:42px;
  border-radius:50%;
  border:4px solid white;
  z-index:20;
  box-shadow:0 7px 12px #000;
}

.moving.red{
  background:#ed1722;
  left:38%;
  top:31%;
}

.moving.green{
  background:#0caf4d;
  right:31%;
  top:34%;
}

.moving.orange{
  background:#f4770b;
  right:29%;
  top:48%;
}

.moving.blue{
  background:#0878ed;
  left:53%;
  bottom:20%;
}

.moving.yellow{
  background:#f2ca09;
  left:28%;
  bottom:30%;
}

.moving.purple{
  background:#7b19db;
  left:31%;
  top:53%;
}

/* FOOTER */

.bottom{
  height:58px;
  min-height:58px;

  display:flex;
  justify-content:center;
  align-items:center;
  gap:15px;

  color:#cbd3dc;
  font-size:13px;
}

.turn{
  padding:7px 15px;
  border-radius:20px;

  background:#14231c;
  border:1px solid #29db76;

  color:#5af295;
}

/* MOBILE */

@media(max-width:600px){

  .top{
    height:60px;
    min-height:60px;
    padding:6px 10px;
  }

  .menu,
  .action{
    width:40px;
    height:40px;
  }

  .crown{
    font-size:27px;
  }

  .title{
    font-size:17px;
  }

  .online{
    font-size:10px;
  }

  .actions{
    gap:5px;
  }

  .stage{
    padding:5px;
  }

  .board{
    width:96vw;
    border-radius:6%;
  }

  .token{
    border-width:2px;
  }

  .safe{
    width:25px;
    height:25px;
    font-size:17px;
  }

  .moving{
    width:30px;
    height:30px;
    border-width:3px;
  }

  .bottom{
    height:45px;
    min-height:45px;
    font-size:10px;
    gap:7px;
  }

  .turn{
    padding:5px 9px;
  }
}
</style>
</head>

<body>

<div class="app">

  <!-- TOP -->

  <header class="top">

    <div class="brand">

      <div class="menu">☰</div>

      <div class="crown">👑</div>

      <div>
        <div class="title">BHAICHARA</div>
        <div class="online">● ONLINE</div>
      </div>

    </div>

    <div class="actions">
      <button class="action">♫</button>
      <button class="action">🔊</button>
      <button class="action">⚙</button>
    </div>

  </header>


  <!-- BOARD -->

  <main class="stage">

    <div class="board">

      <!-- PLAYER 4 RED -->

      <div class="home red">

        <div class="homebox">

          <div class="token redt"></div>
          <div class="token redt"></div>
          <div class="token redt"></div>
          <div class="token redt"></div>

        </div>

      </div>


      <!-- PLAYER 5 GREEN -->

      <div class="home green">

        <div class="homebox">

          <div class="token greent"></div>
          <div class="token greent"></div>
          <div class="token greent"></div>
          <div class="token greent"></div>

        </div>

      </div>


      <!-- PLAYER 6 ORANGE -->

      <div class="home orange">

        <div class="homebox">

          <div class="token oranget"></div>
          <div class="token oranget"></div>
          <div class="token oranget"></div>
          <div class="token oranget"></div>

        </div>

      </div>


      <!-- PLAYER 1 BLUE -->

      <div class="home blue">

        <div class="homebox">

          <div class="token bluet"></div>
          <div class="token bluet"></div>
          <div class="token bluet"></div>
          <div class="token bluet"></div>

        </div>

      </div>


      <!-- PLAYER 2 YELLOW -->

      <div class="home yellow">

        <div class="homebox">

          <div class="token yellowt"></div>
          <div class="token yellowt"></div>
          <div class="token yellowt"></div>
          <div class="token yellowt"></div>

        </div>

      </div>


      <!-- PLAYER 3 PURPLE -->

      <div class="home purple">

        <div class="homebox">

          <div class="token purplet"></div>
          <div class="token purplet"></div>
          <div class="token purplet"></div>
          <div class="token purplet"></div>

        </div>

      </div>


      <!-- TRACKS -->

      <div class="track v" id="topTrack"></div>

      <div class="track v bottom" id="bottomTrack"></div>

      <div class="track h" id="leftTrack"></div>

      <div class="track h right" id="rightTrack"></div>


      <!-- 12 SAFE STARS -->

      <div class="safe s1">★</div>
      <div class="safe s2">★</div>
      <div class="safe s3">★</div>

      <div class="safe s4">★</div>
      <div class="safe s5">★</div>
      <div class="safe s6">★</div>

      <div class="safe s7">★</div>
      <div class="safe s8">★</div>
      <div class="safe s9">★</div>

      <div class="safe s10">★</div>
      <div class="safe s11">★</div>
      <div class="safe s12">★</div>


      <!-- MOVING TOKENS -->

      <div class="moving red"></div>
      <div class="moving green"></div>
      <div class="moving orange"></div>
      <div class="moving blue"></div>
      <div class="moving yellow"></div>
      <div class="moving purple"></div>


      <!-- CENTER DICE -->

      <div class="center">

        <div
          class="dice"
          id="dice"
          onclick="rollDice()"
        >⚄</div>

      </div>

    </div>

  </main>


  <!-- BOTTOM -->

  <footer class="bottom">

    <div
      class="turn"
      id="turn"
    >
      PLAYER 1 — YOUR TURN
    </div>

    <div>
      6 Players • 3 Teams • Undo OFF
    </div>

  </footer>

</div>


<script>

/* DICE */

const diceFaces = [
  "⚀",
  "⚁",
  "⚂",
  "⚃",
  "⚄",
  "⚅"
];

let currentPlayer = 1;

function rollDice(){

  const number =
    Math.floor(Math.random() * 6);

  document.getElementById("dice")
    .textContent = diceFaces[number];

  if(number === 5){

    document.getElementById("turn")
      .textContent =
      "PLAYER " +
      currentPlayer +
      " — 6! EXTRA TURN 🔥";

    return;
  }

  document.getElementById("turn")
    .textContent =
    "PLAYER " +
    currentPlayer +
    " — " +
    (number + 1) +
    " आया";

  setTimeout(function(){

    currentPlayer++;

    if(currentPlayer > 6){
      currentPlayer = 1;
    }

    document.getElementById("turn")
      .textContent =
      "PLAYER " +
      currentPlayer +
      " — YOUR TURN";

  },700);

}

</script>

</body>
</html>
