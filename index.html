<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BHAICHARA — 6 Player Ludo</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:Arial,sans-serif;background:#090d12;color:white}
body{display:flex;justify-content:center;align-items:center;overflow:hidden}

.app{
 width:min(100vw,1100px);
 height:100vh;
 display:flex;
 flex-direction:column;
 background:
 radial-gradient(circle at 50% 45%,#182331 0,#080c11 65%);
}

.top{
 height:72px;
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:8px 18px;
 z-index:10;
 background:linear-gradient(180deg,#111923dd,#080c12aa);
 border-bottom:1px solid #ffffff18;
}

.brand{display:flex;align-items:center;gap:12px}
.menu{
 width:48px;height:48px;border-radius:50%;
 border:2px solid #725b35;background:#0c1118;
 display:flex;align-items:center;justify-content:center;
 font-size:28px;box-shadow:0 0 15px #000;
}
.crown{font-size:34px}
.title{font-size:22px;font-weight:900;letter-spacing:1px}
.online{font-size:12px;color:#41ef76;margin-top:3px}

.actions{display:flex;gap:9px}
.action{
 width:48px;height:48px;border-radius:50%;
 background:#111820;border:2px solid #624f31;
 color:#fff;font-size:23px;
}

.stage{
 flex:1;
 display:flex;
 justify-content:center;
 align-items:center;
 padding:8px;
}

.board{
 position:relative;
 width:min(94vw,850px);
 aspect-ratio:1;
 border-radius:7%;
 background:#141a20;
 box-shadow:
 0 0 0 5px #392918,
 0 0 0 9px #9a702d,
 0 25px 70px #000;
 overflow:hidden;
}

/* golden outer frame */
.board:before{
 content:"";
 position:absolute;
 inset:0;
 border:7px solid #d49b32;
 border-radius:7%;
 pointer-events:none;
 z-index:20;
 box-shadow:inset 0 0 25px #000;
}

/* six home areas */
.home{
 position:absolute;
 width:39%;
 height:39%;
 display:flex;
 justify-content:center;
 align-items:center;
 overflow:hidden;
 clip-path:polygon(0 0,100% 0,100% 58%,58% 100%,0 100%);
}

.home.red{
 left:3%;top:3%;
 background:linear-gradient(145deg,#ff202b,#a60009);
 transform:rotate(0deg);
}
.home.green{
 right:3%;top:3%;
 background:linear-gradient(145deg,#16df68,#008d3d);
 transform:rotate(90deg);
}
.home.orange{
 right:3%;bottom:3%;
 background:linear-gradient(145deg,#ff9b19,#e85a00);
 transform:rotate(180deg);
}
.home.blue{
 right:30.5%;bottom:3%;
 background:linear-gradient(145deg,#168cff,#0057ca);
 transform:rotate(180deg);
}
.home.yellow{
 left:3%;bottom:3%;
 background:linear-gradient(145deg,#ffe21b,#e5aa00);
 transform:rotate(270deg);
}
.home.purple{
 left:3%;top:30.5%;
 background:linear-gradient(145deg,#9b25ff,#5a00b7);
 transform:rotate(270deg);
}

/* home token area */
.homebox{
 width:55%;
 height:55%;
 background:#ffffff0d;
 border-radius:22%;
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:12%;
 padding:12%;
 transform:rotate(0);
 box-shadow:inset 0 0 18px #0004;
}

.home.green .homebox,
.home.orange .homebox,
.home.blue .homebox,
.home.yellow .homebox,
.home.purple .homebox{
 transform:rotate(-90deg);
}
.home.orange .homebox{transform:rotate(180deg)}
.home.blue .homebox{transform:rotate(180deg)}
.home.yellow .homebox{transform:rotate(90deg)}
.home.purple .homebox{transform:rotate(90deg)}

.token{
 width:100%;
 aspect-ratio:1;
 border-radius:50%;
 border:4px solid #ffffffcc;
 box-shadow:
 0 7px 10px #000b,
 0 0 8px #fff4,
  inset 0 4px 5px #fff9;
 position:relative;
}
.token:after{
 content:"";
 position:absolute;
 inset:18%;
 border:2px solid #ffffffbb;
 border-radius:50%;
}

.redt{background:#e90f1c}
.greent{background:#0caf4c}
.oranget{background:#f47b0b}
.bluet{background:#0875e8}
.yellowt{background:#f4c900}
.purplet{background:#7d16df}

/* playing tracks */
.track{
 position:absolute;
 background:#f5f6f5;
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:1px;
 box-shadow:inset 0 0 0 2px #111;
}

.track.v{
 width:13%;
 height:38%;
 left:43.5%;
 top:1%;
}
.track.v.bottom{
 top:auto;
 bottom:1%;
}

.track.h{
 height:13%;
 width:38%;
 left:1%;
 top:43.5%;
}
.track.h.right{
 left:auto;
 right:1%;
}

.cell{
 background:#f7f8f6;
 border:1px solid #8b8b8b;
 min-width:0;
}
.cell.colored.red{background:#ee1722}
.cell.colored.green{background:#10a94d}
.cell.colored.orange{background:#f28712}
.cell.colored.blue{background:#1681e9}
.cell.colored.yellow{background:#f0c70b}
.cell.colored.purple{background:#7818d6}

.safe{
 display:flex;
 justify-content:center;
 align-items:center;
 font-size:clamp(12px,2vw,22px);
 color:#fff;
}

/* central dice area */
.center{
 position:absolute;
 left:50%;top:50%;
 transform:translate(-50%,-50%);
 width:29%;
 aspect-ratio:1;
 border-radius:50%;
 background:
 radial-gradient(circle,#176eff 0,#07357c 53%,#03152d 70%);
 border:8px solid #c58a28;
 box-shadow:
 0 0 0 5px #111,
 0 0 25px #087bff,
 0 12px 25px #000;
 display:flex;
 align-items:center;
 justify-content:center;
 z-index:15;
}

.dice{
 width:48%;
 aspect-ratio:1;
 border-radius:20%;
 background:linear-gradient(145deg,#fff,#d5d9df);
 color:#111;
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:clamp(38px,7vw,65px);
 box-shadow:0 8px 15px #0008,inset 0 2px 3px #fff;
 cursor:pointer;
 user-select:none;
 transition:.15s;
}
.dice:active{transform:scale(.92)}

.pointer{
 position:absolute;
 font-size:25px;
 font-weight:900;
 z-index:12;
 text-shadow:0 2px 4px #000;
}
.p-red{left:26%;top:28%;color:#ff2430}
.p-green{right:27%;top:28%;color:#20db6a}
.p-orange{right:27%;bottom:28%;color:#ff9a1d}
.p-blue{right:43%;bottom:15%;color:#238dff}
.p-yellow{left:28%;bottom:28%;color:#ffe21a}
.p-purple{left:27%;top:48%;color:#a84dff}

/* moving tokens */
.moving{
 position:absolute;
 width:42px;
 height:42px;
 border-radius:50%;
 border:4px solid #fff;
 z-index:18;
 box-shadow:0 6px 10px #000;
}
.moving.red{background:#e91621;left:37%;top:30%}
.moving.green{background:#0daf4e;right:30%;top:34%}
.moving.orange{background:#f4770b;right:28%;top:47%}
.moving.blue{background:#0878ed;left:53%;bottom:20%}
.moving.yellow{background:#f2ca09;left:27%;bottom:30%}
.moving.purple{background:#7b19db;left:31%;top:52%}

.bottom{
 height:58px;
 display:flex;
 justify-content:center;
 align-items:center;
 gap:15px;
 color:#cbd3dc;
 font-size:13px;
}
.turn{
 padding:7px 15px;
 border-radius:20px;
 background:#14231c;
 border:1px solid #29db76;
 color:#5af295;
}
</style>
</head>

<body>

<div class="app">

<header class="top">
 <div class="brand">
  <div class="menu">☰</div>
  <div class="crown">👑</div>
  <div>
   <div class="title">BHAICHARA</div>
   <div class="online">● Online</div>
  </div>
 </div>

 <div class="actions">
  <button class="action">♫</button>
  <button class="action">🔊</button>
  <button class="action">⚙</button>
 </div>
</header>

<main class="stage">

<div class="board">

 <!-- HOME ZONES -->

 <div class="home red">
  <div class="homebox">
   <i class="token redt"></i><i class="token redt"></i>
   <i class="token redt"></i><i class="token redt"></i>
  </div>
 </div>

 <div class="home green">
  <div class="homebox">
   <i class="token greent"></i><i class="token greent"></i>
   <i class="token greent"></i><i class="token greent"></i>
  </div>
 </div>

 <div class="home orange">
  <div class="homebox">
   <i class="token oranget"></i><i class="token oranget"></i>
   <i class="token oranget"></i><i class="token oranget"></i>
  </div>
 </div>

 <div class="home blue">
  <div class="homebox">
   <i class="token bluet"></i><i class="token bluet"></i>
   <i class="token bluet"></i><i class="token bluet"></i>
  </div>
 </div>

 <div class="home yellow">
  <div class="homebox">
   <i class="token yellowt"></i><i class="token yellowt"></i>
   <i class="token yellowt"></i><i class="token yellowt"></i>
  </div>
 </div>

 <div class="home purple">
  <div class="homebox">
   <i class="token purplet"></i><i class="token purplet"></i>
   <i class="token purplet"></i><i class="token purplet"></i>
  </div>
 </div>

 <!-- TRACKS -->

 <div class="track v" id="topTrack"></div>
 <div class="track v bottom" id="bottomTrack"></div>
 <div class="track h" id="leftTrack"></div>
 <div class="track h right" id="rightTrack"></div>

 <!-- SAFE STARS -->
 <div class="safe pointer p-red">★</div>
 <div class="safe pointer p-green">★</div>
 <div class="safe pointer p-orange">★</div>
 <div class="safe pointer p-blue">★</div>
 <div class="safe pointer p-yellow">★</div>
 <div class="safe pointer p-purple">★</div>

 <!-- EXTRA SAFE POSITIONS -->
 <div class="safe pointer" style="left:31%;top:25%">★</div>
 <div class="safe pointer" style="right:31%;top:25%">★</div>
 <div class="safe pointer" style="right:31%;bottom:25%">★</div>
 <div class="safe pointer" style="left:31%;bottom:25%">★</div>
 <div class="safe pointer" style="left:46%;top:21%">★</div>
 <div class="safe pointer" style="left:46%;bottom:21%">★</div>

 <!-- TOKENS ON TRACK -->

 <div class="moving red"></div>
 <div class="moving green"></div>
 <div class="moving orange"></div>
 <div class="moving blue"></div>
 <div class="moving yellow"></div>
 <div class="moving purple"></div>

 <!-- CENTER DICE -->

 <div class="center">
  <div class="dice" id="dice" onclick="rollDice()">⚄</div>
 </div>

</div>
</main>

<footer class="bottom">
 <div class="turn" id="turn">PLAYER 1 — YOUR TURN</div>
 <div>6 Players • 3 Teams • Undo OFF</div>
</footer>

</div>

<script>
const faces=["⚀","⚁","⚂","⚃","⚄","⚅"];
let player=1;

function rollDice(){
 const n=Math.floor(Math.random()*6);
 document.getElementById("dice").textContent=faces[n];

 if(n===5){
  document.getElementById("turn").textContent=
   "PLAYER "+player+" — 6! EXTRA TURN 🔥";
 }else{
  document.getElementById("turn").textContent=
   "PLAYER "+player+" — "+(n+1)+" आया";
  setTimeout(()=>{
   player++;
   if(player>6)player=1;
   document.getElementById("turn").textContent=
    "PLAYER "+player+" — YOUR TURN";
  },700);
 }
}
</script>

</body>
</html>
