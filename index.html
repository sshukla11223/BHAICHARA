<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>BHAICHARA</title>

<style>
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#02070c;
  font-family:Arial,sans-serif;
}
body{
  display:flex;
  justify-content:center;
  align-items:center;
}
#game{
  position:relative;
  width:min(100vw,100vh);
  height:min(100vw,100vh);
}
canvas{
  width:100%;
  height:100%;
  display:block;
}
.brand{
  position:absolute;
  top:13px;
  left:18px;
  color:#fff;
  font-weight:900;
  font-size:clamp(22px,5vw,38px);
  letter-spacing:3px;
  text-shadow:0 3px 10px #000;
}
.online{
  position:absolute;
  right:16px;
  top:15px;
  padding:8px 15px;
  border:1px solid #46ff99;
  border-radius:25px;
  color:#46ff99;
  background:#04150de8;
  font-weight:bold;
  font-size:13px;
}
.online span{
  display:inline-block;
  width:8px;
  height:8px;
  border-radius:50%;
  background:#46ff99;
  box-shadow:0 0 10px #46ff99;
  margin-right:6px;
}
.info{
  position:absolute;
  bottom:9px;
  left:50%;
  transform:translateX(-50%);
  background:#02070ddd;
  color:white;
  border:1px solid #ffffff30;
  border-radius:22px;
  padding:8px 16px;
  font-size:12px;
  white-space:nowrap;
}
</style>
</head>

<body>

<div id="game">
  <canvas id="board"></canvas>

  <div class="brand">BHAICHARA</div>

  <div class="online">
    <span></span>ONLINE
  </div>

  <div class="info" id="info">
    P1 की बारी • Dice दबाएँ
  </div>
</div>

<script>

const canvas=document.getElementById("board");
const ctx=canvas.getContext("2d");

let size=0;
let cx=0;
let cy=0;
let dice=6;

const players=[
  {id:"P5",name:"P5",color:"#09B95A",dark:"#057139",light:"#55F39A",angle:-90},
  {id:"P6",name:"P6",color:"#F47A16",dark:"#994208",light:"#FFB063",angle:-30},
  {id:"P1",name:"P1",color:"#087EF2",dark:"#034C9A",light:"#55B9FF",angle:30},
  {id:"P2",name:"P2",color:"#F0C400",dark:"#9D7C00",light:"#FFE65A",angle:90},
  {id:"P3",name:"P3",color:"#8428C7",dark:"#4D1479",light:"#C15BFF",angle:150},
  {id:"P4",name:"P4",color:"#E62B32",dark:"#8E161A",light:"#FF666C",angle:210}
];

/* --------------------------------
   RESIZE
-------------------------------- */

function resize(){

  const dpr=Math.min(devicePixelRatio||1,2);

  size=Math.min(innerWidth,innerHeight);

  canvas.width=size*dpr;
  canvas.height=size*dpr;

  canvas.style.width=size+"px";
  canvas.style.height=size+"px";

  ctx.setTransform(dpr,0,0,dpr,0,0);

  cx=size/2;
  cy=size/2;

  draw();
}

addEventListener("resize",resize);


/* --------------------------------
   HELPERS
-------------------------------- */

function R(deg){
  return deg*Math.PI/180;
}

function polar(r,a){
  a=R(a-90);
  return {
    x:cx+Math.cos(a)*r,
    y:cy+Math.sin(a)*r
  };
}

function poly(points,fill,stroke="#07131c",width=2){

  ctx.beginPath();

  points.forEach((p,i)=>{
    i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y);
  });

  ctx.closePath();

  ctx.fillStyle=fill;
  ctx.fill();

  if(stroke){
    ctx.strokeStyle=stroke;
    ctx.lineWidth=width;
    ctx.stroke();
  }
}

function hex(x,y,r,fill,stroke="#111",width=2){

  ctx.beginPath();

  for(let i=0;i<6;i++){

    const a=R(i*60-30);
    const px=x+Math.cos(a)*r;
    const py=y+Math.sin(a)*r;

    i?ctx.lineTo(px,py):ctx.moveTo(px,py);
  }

  ctx.closePath();

  ctx.fillStyle=fill;
  ctx.fill();

  ctx.strokeStyle=stroke;
  ctx.lineWidth=width;
  ctx.stroke();
}


/* --------------------------------
   BACKGROUND
-------------------------------- */

function background(){

  const g=ctx.createRadialGradient(
    cx,cy,size*.05,
    cx,cy,size*.75
  );

  g.addColorStop(0,"#102B3B");
  g.addColorStop(.55,"#07141E");
  g.addColorStop(1,"#010408");

  ctx.fillStyle=g;
  ctx.fillRect(0,0,size,size);

  /* marble-like lines */

  ctx.globalAlpha=.10;
  ctx.strokeStyle="#8DA9B8";
  ctx.lineWidth=1;

  for(let i=0;i<18;i++){

    ctx.beginPath();

    ctx.moveTo(
      Math.random()*size,
      0
    );

    ctx.bezierCurveTo(
      size*.2,
      size*.3,
      size*.8,
      size*.6,
      Math.random()*size,
      size
    );

    ctx.stroke();
  }

  ctx.globalAlpha=1;
}


/* --------------------------------
   OUTER GOLD FRAME
-------------------------------- */

function frame(){

  const r=size*.465;

  ctx.save();

  ctx.shadowColor="#000";
  ctx.shadowBlur=size*.025;

  ctx.beginPath();
  ctx.arc(cx,cy,r,0,Math.PI*2);

  ctx.fillStyle="#07131D";
  ctx.fill();

  const gold=ctx.createLinearGradient(
    cx-r,cy-r,
    cx+r,cy+r
  );

  gold.addColorStop(0,"#70430A");
  gold.addColorStop(.25,"#F4B52F");
  gold.addColorStop(.5,"#FFE78B");
  gold.addColorStop(.75,"#C77F16");
  gold.addColorStop(1,"#6E4009");

  ctx.strokeStyle=gold;
  ctx.lineWidth=size*.014;
  ctx.stroke();

  ctx.restore();

  ctx.beginPath();
  ctx.arc(cx,cy,r*.955,0,Math.PI*2);

  ctx.strokeStyle="#416277";
  ctx.lineWidth=size*.004;
  ctx.stroke();
}


/* --------------------------------
   SIX HOME AREAS
-------------------------------- */

function home(player){

  const outer=size*.375;
  const inner=size*.105;
  const spread=28;

  const a=player.angle;

  const p1=polar(inner,a-spread);
  const p2=polar(outer,a-spread);
  const p3=polar(outer,a+spread);
  const p4=polar(inner,a+spread);

  const grad=ctx.createLinearGradient(
    p2.x,p2.y,
    p3.x,p3.y
  );

  grad.addColorStop(0,player.light);
  grad.addColorStop(.45,player.color);
  grad.addColorStop(1,player.dark);

  poly(
    [p1,p2,p3,p4],
    grad,
    "#06111A",
    size*.005
  );

  /* inner highlight */

  const q1=polar(size*.13,a-spread+3);
  const q2=polar(size*.35,a-spread+3);
  const q3=polar(size*.35,a+spread-3);
  const q4=polar(size*.13,a+spread-3);

  poly(
    [q1,q2,q3,q4],
    player.color,
    "#ffffff22",
    1
  );
}


/* --------------------------------
   HOME LANE
-------------------------------- */

function homeLane(player){

  for(let i=1;i<=6;i++){

    const r=size*.255-(i-1)*size*.026;

    const p=polar(r,player.angle);

    const w=size*.034;

    ctx.fillStyle=player.color;

    ctx.strokeStyle="#07131D";
    ctx.lineWidth=1.5;

    ctx.beginPath();

    ctx.roundRect(
      p.x-w/2,
      p.y-w/2,
      w,
      w,
      w*.12
    );

    ctx.fill();
    ctx.stroke();
  }
}


/* --------------------------------
   TRACK
-------------------------------- */

/*
  72 cells
  12 cells per player
*/

const TRACK=72;

function trackPoint(i){

  const section=Math.floor(i/12);
  const inside=i%12;

  const start=section*60-30;
  const end=start+60;

  const t=inside/12;

  const a=polar(size*.335,start);
  const b=polar(size*.335,end);

  return {
    x:a.x+(b.x-a.x)*t,
    y:a.y+(b.y-a.y)*t
  };
}

function drawTrack(){

  const cell=size*.032;

  for(let i=0;i<TRACK;i++){

    const p=trackPoint(i);

    let color="#F4F7F7";

    const playerIndex=Math.floor(i/12);

    if(i%12===0){
      color=players[playerIndex].color;
    }

    ctx.fillStyle=color;
    ctx.strokeStyle="#24343E";
    ctx.lineWidth=1.2;

    ctx.beginPath();

    ctx.roundRect(
      p.x-cell/2,
      p.y-cell/2,
      cell,
      cell,
      cell*.13
    );

    ctx.fill();
    ctx.stroke();
  }
}


/* --------------------------------
   STARS — EXACTLY 12
-------------------------------- */

function star(x,y,r){

  ctx.save();

  ctx.translate(x,y);

  ctx.beginPath();

  for(let i=0;i<10;i++){

    const rr=i%2===0?r:r*.42;
    const a=-Math.PI/2+i*Math.PI/5;

    const px=Math.cos(a)*rr;
    const py=Math.sin(a)*rr;

    i?ctx.lineTo(px,py):ctx.moveTo(px,py);
  }

  ctx.closePath();

  ctx.fillStyle="#FFD83C";
  ctx.strokeStyle="#B77B00";
  ctx.lineWidth=1;

  ctx.shadowColor="#FFD83C";
  ctx.shadowBlur=r;

  ctx.fill();
  ctx.stroke();

  ctx.restore();
}

function stars(){

  for(let p=0;p<6;p++){

    [p*12+3,p*12+9].forEach(i=>{

      const q=trackPoint(i);

      star(
        q.x,
        q.y,
        size*.010
      );
    });
  }
}


/* --------------------------------
   ARROWS
-------------------------------- */

function arrows(){

  players.forEach((player,i)=>{

    const q=trackPoint(i*12+6);

    ctx.save();

    ctx.translate(q.x,q.y);

    ctx.fillStyle=player.color;

    ctx.beginPath();

    ctx.moveTo(size*.009,0);
    ctx.lineTo(-size*.007,-size*.006);
    ctx.lineTo(-size*.003,0);
    ctx.lineTo(-size*.007,size*.006);

    ctx.closePath();
    ctx.fill();

    ctx.restore();
  });
}


/* --------------------------------
   TOKEN
-------------------------------- */

function token(x,y,player,r){

  ctx.save();

  ctx.shadowColor="#000";
  ctx.shadowBlur=r*.8;
  ctx.shadowOffsetY=r*.25;

  const g=ctx.createRadialGradient(
    x-r*.35,
    y-r*.4,
    1,
    x,
    y,
    r
  );

  g.addColorStop(0,"#ffffff");
  g.addColorStop(.10,player.light);
  g.addColorStop(.52,player.color);
  g.addColorStop(1,player.dark);

  ctx.beginPath();
  ctx.arc(x,y,r,0,Math.PI*2);

  ctx.fillStyle=g;
  ctx.fill();

  ctx.restore();

  ctx.beginPath();
  ctx.arc(x,y,r*.64,0,Math.PI*2);

  ctx.strokeStyle="#fff";
  ctx.lineWidth=Math.max(1,r*.09);
  ctx.stroke();
}


/* --------------------------------
   PLAYER BASE
-------------------------------- */

function playerBase(player){

  const p=polar(size*.425,player.angle);

  const base=size*.055;

  ctx.save();

  ctx.shadowColor="#000";
  ctx.shadowBlur=size*.014;

  ctx.beginPath();
  ctx.arc(p.x,p.y,base,0,Math.PI*2);

  ctx.fillStyle="#02070C";
  ctx.fill();

  ctx.strokeStyle="#ffffff28";
  ctx.lineWidth=2;
  ctx.stroke();

  ctx.restore();

  const gap=size*.020;
  const r=size*.0185;

  token(p.x-gap,p.y-gap,player,r);
  token(p.x+gap,p.y-gap,player,r);
  token(p.x-gap,p.y+gap,player,r);
  token(p.x+gap,p.y+gap,player,r);

  const label=polar(size*.456,player.angle);

  ctx.fillStyle="#fff";
  ctx.font=`900 ${Math.max(12,size*.020)}px Arial`;
  ctx.textAlign="center";
  ctx.textBaseline="middle";

  ctx.fillText(player.name,label.x,label.y);
}


/* --------------------------------
   DICE
-------------------------------- */

function dice(){

  const r=size*.097;

  hex(
    cx,
    cy,
    r,
    "#02080E",
    "#F2B833",
    size*.006
  );

  hex(
    cx,
    cy,
    r*.78,
    "#056FCE",
    "#5BC9FF",
    size*.004
  );

  ctx.beginPath();

  ctx.arc(
    cx,
    cy,
    r*.53,
    0,
    Math.PI*2
  );

  const glow=ctx.createRadialGradient(
    cx-r*.2,
    cy-r*.2,
    2,
    cx,
    cy,
    r*.55
  );

  glow.addColorStop(0,"#5BD5FF");
  glow.addColorStop(.5,"#087DD8");
  glow.addColorStop(1,"#03416F");

  ctx.fillStyle=glow;
  ctx.fill();

  ctx.strokeStyle="#9DE7FF";
  ctx.lineWidth=2;
  ctx.stroke();

  drawDie();
}

function drawDie(){

  const r=size*.040;

  ctx.save();

  ctx.shadowColor="#000";
  ctx.shadowBlur=size*.012;
  ctx.shadowOffsetY=size*.006;

  ctx.fillStyle="#F8FAFA";
  ctx.strokeStyle="#CBD5D8";
  ctx.lineWidth=1.5;

  ctx.beginPath();

  ctx.roundRect(
    cx-r,
    cy-r,
    r*2,
    r*2,
    r*.18
  );

  ctx.fill();
  ctx.stroke();

  ctx.restore();

  const positions={
    1:[[0,0]],

    2:[
      [-.32,-.32],
      [.32,.32]
    ],

    3:[
      [-.32,-.32],
      [0,0],
      [.32,.32]
    ],

    4:[
      [-.32,-.32],
      [.32,-.32],
      [-.32,.32],
      [.32,.32]
    ],

    5:[
      [-.32,-.32],
      [.32,-.32],
      [0,0],
      [-.32,.32],
      [.32,.32]
    ],

    6:[
      [-.32,-.32],
      [.32,-.32],
      [-.32,0],
      [.32,0],
      [-.32,.32],
      [.32,.32]
    ]
  };

  positions[dice].forEach(v=>{

    ctx.beginPath();

    ctx.arc(
      cx+v[0]*r*1.42,
      cy+v[1]*r*1.42,
      r*.095,
      0,
      Math.PI*2
    );

    ctx.fillStyle="#D8232A";
    ctx.fill();
  });
}


/* --------------------------------
   MAIN DRAW
-------------------------------- */

function draw(){

  background();

  frame();

  /*
    Six connected home zones
  */

  players.forEach(home);

  /*
    Colored lanes
  */

  players.forEach(homeLane);

  /*
    White continuous path
  */

  drawTrack();

  /*
    Safe stars
  */

  stars();

  /*
    Direction arrows
  */

  arrows();

  /*
    24 tokens
  */

  players.forEach(playerBase);

  /*
    Center
  */

  dice();
}


/* --------------------------------
   DICE CLICK
-------------------------------- */

canvas.addEventListener("click",function(e){

  const rect=canvas.getBoundingClientRect();

  const x=e.clientX-rect.left;
  const y=e.clientY-rect.top;

  const d=Math.hypot(x-cx,y-cy);

  if(d<size*.13){

    dice=Math.floor(Math.random()*6)+1;

    draw();

    document.getElementById("info").textContent=
      `P1 की बारी • ${dice} आया • Token चुनें`;
  }
});


resize();

</script>

</body>
</html>
