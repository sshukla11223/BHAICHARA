<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>BHAICHARA — 6 Player Ludo</title>

<style>
*{box-sizing:border-box}
html,body{
  margin:0;width:100%;height:100%;
  overflow:hidden;
  font-family:Arial,Helvetica,sans-serif;
  background:
    radial-gradient(circle at 50% 45%,#163b57 0,#07121d 48%,#02070c 100%);
  color:white;
}
body{
  display:flex;
  justify-content:center;
  align-items:center;
}
.game{
  width:min(96vw,96vh,1050px);
  aspect-ratio:1/1.08;
  position:relative;
}
.top{
  height:8%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 2%;
}
.logo{
  font-weight:1000;
  letter-spacing:4px;
  font-size:clamp(18px,3vw,34px);
  text-shadow:0 3px 8px #000;
}
.online{
  border:1px solid #36e58a;
  color:#5cffad;
  border-radius:30px;
  padding:7px 14px;
  font-size:12px;
  font-weight:800;
  box-shadow:0 0 15px #1aff7933;
}
.online i{
  display:inline-block;
  width:8px;height:8px;
  background:#43ff9a;
  border-radius:50%;
  margin-right:6px;
  box-shadow:0 0 8px #43ff9a;
}
.boardWrap{
  position:absolute;
  left:1%;
  right:1%;
  top:9%;
  bottom:3%;
  display:flex;
  justify-content:center;
  align-items:center;
}
svg{
  width:100%;
  height:100%;
  overflow:visible;
  filter:drop-shadow(0 18px 25px #000b);
}
.cell{
  stroke:#07131d;
  stroke-width:2;
}
.token{
  cursor:pointer;
  transition:.18s;
}
.token:hover{
  filter:brightness(1.25) drop-shadow(0 0 8px white);
}
.token.selectable{
  animation:pulse .8s infinite alternate;
}
@keyframes pulse{
  from{filter:drop-shadow(0 0 3px white)}
  to{filter:drop-shadow(0 0 14px white)}
}
.turnText{
  position:absolute;
  bottom:1%;
  left:50%;
  transform:translateX(-50%);
  background:#07131dcc;
  border:1px solid #ffffff25;
  padding:8px 18px;
  border-radius:20px;
  font-size:12px;
  white-space:nowrap;
}
#dice{
  cursor:pointer;
}
#dice.disabled{
  opacity:.65;
  cursor:default;
}
.diceFace{
  fill:#1979d8;
  stroke:#8bd4ff;
  stroke-width:4;
  filter:drop-shadow(0 6px 8px #0009);
}
.pip{fill:white}
.message{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  pointer-events:none;
  background:#020912dd;
  border:1px solid #ffffff33;
  padding:12px 22px;
  border-radius:16px;
  font-size:14px;
  font-weight:800;
  opacity:0;
  transition:.25s;
  z-index:5;
}
.message.show{opacity:1}
</style>
</head>

<body>

<div class="game">

  <div class="top">
    <div class="logo">BHAICHARA</div>
    <div class="online"><i></i>ONLINE</div>
  </div>

  <div class="boardWrap">
    <svg id="board" viewBox="0 0 1000 1000">

      <defs>
        <filter id="shadow">
          <feDropShadow dx="0" dy="5" stdDeviation="5"
                        flood-color="#000" flood-opacity=".55"/>
        </filter>

        <linearGradient id="gold" x1="0" x2="1">
          <stop offset="0" stop-color="#8b5b19"/>
          <stop offset=".5" stop-color="#ffd66b"/>
          <stop offset="1" stop-color="#7c4b12"/>
        </linearGradient>

        <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
          <stop stop-color="#48aaff"/>
          <stop offset=".5" stop-color="#0872ca"/>
          <stop offset="1" stop-color="#03447e"/>
        </linearGradient>

        <radialGradient id="blueTok">
          <stop stop-color="#52baff"/>
          <stop offset=".65" stop-color="#147bd2"/>
          <stop offset="1" stop-color="#03497f"/>
        </radialGradient>

        <radialGradient id="yellowTok">
          <stop stop-color="#fff46a"/>
          <stop offset=".65" stop-color="#e9b900"/>
          <stop offset="1" stop-color="#916800"/>
        </radialGradient>

        <radialGradient id="purpleTok">
          <stop stop-color="#d889ff"/>
          <stop offset=".65" stop-color="#8429bb"/>
          <stop offset="1" stop-color="#48106c"/>
        </radialGradient>

        <radialGradient id="redTok">
          <stop stop-color="#ff7373"/>
          <stop offset=".65" stop-color="#d62828"/>
          <stop offset="1" stop-color="#781010"/>
        </radialGradient>

        <radialGradient id="greenTok">
          <stop stop-color="#68ff9b"/>
          <stop offset=".65" stop-color="#18a95a"/>
          <stop offset="1" stop-color="#075c2d"/>
        </radialGradient>

        <radialGradient id="orangeTok">
          <stop stop-color="#ffb36a"/>
          <stop offset=".65" stop-color="#ef7117"/>
          <stop offset="1" stop-color="#8d3600"/>
        </radialGradient>
      </defs>

      <!-- OUTER FRAME -->
      <circle cx="500" cy="500" r="455"
              fill="#071521"
              stroke="url(#gold)"
              stroke-width="18"
              filter="url(#shadow)"/>

      <circle cx="500" cy="500" r="425"
              fill="#0b2030"
              stroke="#29465a"
              stroke-width="4"/>

      <!-- HOME WEDGES -->
      <g id="homes"></g>

      <!-- CIRCULAR TRACK -->
      <g id="track"></g>

      <!-- SAFE STARS -->
      <g id="stars"></g>

      <!-- CENTRAL HEXAGON -->
      <polygon points="500,385 600,442 600,558 500,615 400,558 400,442"
               fill="#071522"
               stroke="url(#gold)"
               stroke-width="9"
               filter="url(#shadow)"/>

      <polygon points="500,405 580,452 580,548 500,595 420,548 420,452"
               fill="url(#blue)"
               stroke="#63c6ff"
               stroke-width="3"/>

      <!-- DICE -->
      <g id="dice" transform="translate(500 500)">
        <polygon class="diceFace"
          points="0,-58 50,-29 50,29 0,58 -50,29 -50,-29"/>
        <g id="pips"></g>
      </g>

      <!-- TOKENS -->
      <g id="tokens"></g>

    </svg>

    <div id="msg" class="message"></div>
    <div id="turn" class="turnText">P1 की बारी • Dice दबाएँ</div>
  </div>
</div>

<script>
/* =========================================================
   BHAICHARA — 6 PLAYER PARTNER LUDO
   P1+P4 | P2+P5 | P3+P6
   ========================================================= */

const NS="http://www.w3.org/2000/svg";
const board=document.getElementById("board");
const track=document.getElementById("track");
const homes=document.getElementById("homes");
const stars=document.getElementById("stars");
const tokensLayer=document.getElementById("tokens");
const pips=document.getElementById("pips");
const dice=document.getElementById("dice");
const turnText=document.getElementById("turn");
const msg=document.getElementById("msg");

const players=[
  {id:0,name:"P1",color:"#168bea",grad:"url(#blueTok)",team:0},
  {id:1,name:"P2",color:"#f1c900",grad:"url(#yellowTok)",team:1},
  {id:2,name:"P3",color:"#8a32c5",grad:"url(#purpleTok)",team:2},
  {id:3,name:"P4",color:"#dc3030",grad:"url(#redTok)",team:0},
  {id:4,name:"P5",color:"#19aa59",grad:"url(#greenTok)",team:1},
  {id:5,name:"P6",color:"#ef7419",grad:"url(#orangeTok)",team:2}
];

const partners={
  0:3,3:0,
  1:4,4:1,
  2:5,5:2
};

const N=72;
const cx=500,cy=500;
const pathR=300;
const homeR=365;

/* प्रत्येक player की starting position */
const starts=[0,12,24,36,48,60];

/* 12 SAFE STARS — exactly 2 per player */
const safe=[];
for(let i=0;i<6;i++){
  safe.push(starts[i]);
  safe.push((starts[i]+6)%N);
}

/* ---------------- SVG helpers ---------------- */

function el(tag,attrs={}){
  const e=document.createElementNS(NS,tag);
  for(const k in attrs)e.setAttribute(k,attrs[k]);
  return e;
}

function polar(r,a){
  const rad=(a-90)*Math.PI/180;
  return [cx+r*Math.cos(rad),cy+r*Math.sin(rad)];
}

function pointForPath(index){
  index=((index%N)+N)%N;
  const a=index*360/N;
  return polar(pathR,a);
}

/* ---------------- HOME AREAS ---------------- */

const homeAngles=[
  -90,       // P1 blue
  -30,       // P2 yellow
   30,       // P3 purple
   90,       // P4 red
  150,       // P5 green
  210        // P6 orange
];

players.forEach((p,i)=>{
  const a=homeAngles[i];
  const p1=polar(homeR-15,a-25);
  const p2=polar(homeR-15,a+25);

  const poly=el("polygon",{
    points:`${cx},${cy} ${p1[0]},${p1[1]} ${p2[0]},${p2[1]}`,
    fill:p.color,
    opacity:.88,
    stroke:"#07131d",
    "stroke-width":5
  });
  homes.appendChild(poly);

  /* inner home circle */
  const c=polar(330,a);
  const inner=el("circle",{
    cx:c[0],cy:c[1],r:72,
    fill:"#071522",
    stroke:"#ffffff30",
    "stroke-width":3
  });
  homes.appendChild(inner);

  /* player label */
  const t=el("text",{
    x:c[0],y:c[1]-87,
    "text-anchor":"middle",
    fill:"#fff",
    "font-size":"22",
    "font-weight":"900"
  });
  t.textContent=p.name;
  homes.appendChild(t);
});

/* ---------------- TRACK ---------------- */

for(let i=0;i<N;i++){
  const [x,y]=pointForPath(i);
  const rect=el("rect",{
    x:x-15,y:y-15,
    width:30,height:30,
    rx:6,
    class:"cell",
    fill:"#d8e3e8",
    opacity:.96
  });

  /* start cells */
  const playerAtStart=starts.indexOf(i);
  if(playerAtStart>=0){
    rect.setAttribute("fill",players[playerAtStart].color);
  }

  track.appendChild(rect);
}

/* ---------------- SAFE STARS ---------------- */

safe.forEach(index=>{
  const [x,y]=pointForPath(index);

  const star=el("text",{
    x:x,
    y:y+8,
    "text-anchor":"middle",
    "font-size":"24",
    fill:"#ffd84c",
    "font-weight":"900",
    "pointer-events":"none"
  });
  star.textContent="★";
  stars.appendChild(star);
});

/* ---------------- HOME TOKEN POSITIONS ---------------- */

const homePositions={};

players.forEach((p,i)=>{
  const a=homeAngles[i];

  homePositions[p.id]=[];

  for(let k=0;k<4;k++){
    const offsets=[
      [-28,-28],
      [ 28,-28],
      [-28, 28],
      [ 28, 28]
    ][k];

    const center=polar(330,a);
    homePositions[p.id].push([
      center[0]+offsets[0],
      center[1]+offsets[1]
    ]);
  }
});

/* ---------------- TOKEN DATA ---------------- */

const tokens=[];

for(let p=0;p<6;p++){
  for(let n=0;n<4;n++){
    tokens.push({
      id:`${p}-${n}`,
      player:p,
      number:n,
      state:"base",
      progress:-1,
      finished:false,
      node:null
    });
  }
}

/*
 progress:
 -1 = base
 0..71 = circular path
 72..77 = home lane
 78 = finished
*/

function globalIndex(token){
  if(token.progress<0)return null;
  if(token.progress>=72)return null;

  return (starts[token.player]+token.progress)%N;
}

function tokenPosition(token){

  if(token.state==="base"){
    return homePositions[token.player][token.number];
  }

  if(token.progress>=72){
    const p=players[token.player];
    const a=homeAngles[token.player];

    const lane=token.progress-72;
    const r=285-lane*25;
    return polar(r,a);
  }

  return pointForPath(globalIndex(token));
}

/* ---------------- TOKEN DRAW ---------------- */

function drawTokens(){
  tokensLayer.innerHTML="";

  tokens.forEach(token=>{
    const [x,y]=tokenPosition(token);
    const p=players[token.player];

    const g=el("g",{
      class:"token",
      transform:`translate(${x},${y})`
    });

    if(isSelectable(token)){
      g.classList.add("selectable");
    }

    const shadow=el("circle",{
      cx:3,cy:5,r:13,
      fill:"#000",
      opacity:.45
    });

    const outer=el("circle",{
      cx:0,cy:0,r:13,
      fill:p.grad,
      stroke:"#07131d",
      "stroke-width":2
    });

    const ring=el("circle",{
      cx:0,cy:0,r:9,
      fill:"none",
      stroke="#ffffff",
      "stroke-width":1.5",
      opacity:.55
    });

    const shine=el("circle",{
      cx:-4,cy:-5,r:3,
      fill:"#fff",
      opacity:.6
    });

    g.appendChild(shadow);
    g.appendChild(outer);
    g.appendChild(ring);
    g.appendChild(shine);

    g.addEventListener("click",()=>{
      if(isSelectable(token)) moveToken(token);
    });

    tokensLayer.appendChild(g);
    token.node=g;
  });
}

/* ---------------- TURN ---------------- */

let currentPlayer=0;
let diceValue=0;
let rolling=false;

function ownTokensDone(player){
  return tokens.filter(t=>
    t.player===player && t.finished
  ).length===4;
}

function teamDone(team){
  return tokens.filter(t=>
    players[t.player].team===team && t.finished
  ).length===8;
}

function controllablePlayers(player){
  const arr=[player];

  /* Custom rule:
     own 4 tokens home होने के बाद partner tokens */
  if(ownTokensDone(player)){
    arr.push(partners[player]);
  }

  return arr;
}

function isSelectable(token){

  if(rolling || diceValue===0)return false;

  if(!controllablePlayers(currentPlayer).includes(token.player))
    return false;

  if(token.finished)return false;

  return canMove(token,diceValue);
}

/* ---------------- MOVE VALIDATION ---------------- */

function canMove(token,roll){

  if(token.progress===78)return false;

  if(token.progress===-1){
    return roll===6;
  }

  return token.progress+roll<=78;
}

/* ---------------- DICE ---------------- */

function setDice(n){

  pips.innerHTML="";

  const patterns={
    1:[[0,0]],
    2:[[-20,-20],[20,20]],
    3:[[-20,-20],[0,0],[20,20]],
    4:[[-20,-20],[20,-20],[-20,20],[20,20]],
    5:[[-20,-20],[20,-20],[0,0],[-20,20],[20,20]],
    6:[[-20,-24],[20,-24],[-20,0],[20,0],[-20,24],[20,24]]
  };

  patterns[n].forEach(([x,y])=>{
    const c=el("circle",{
      cx:x,cy:y,r:6,
      class:"pip"
    });
    pips.appendChild(c);
  });
}

setDice(1);

dice.addEventListener("click",rollDice);

function rollDice(){

  if(rolling || diceValue!==0)return;

  rolling=true;

  let count=0;

  const timer=setInterval(()=>{
    setDice(1+Math.floor(Math.random()*6));
    count++;

    if(count>=9){
      clearInterval(timer);

      diceValue=1+Math.floor(Math.random()*6);
      setDice(diceValue);

      rolling=false;
      afterRoll();
    }
  },75);
}

/* ---------------- AFTER ROLL ---------------- */

function afterRoll(){

  const possible=tokens.some(t=>isSelectable(t));

  if(!possible){

    showMessage(
      diceValue===6
      ?"6 आया लेकिन कोई चाल नहीं है"
      :"कोई चाल उपलब्ध नहीं"
    );

    setTimeout(()=>{
      if(diceValue!==6){
        nextTurn();
      }else{
        diceValue=0;
        updateTurn();
      }
    },850);

    return;
  }

  updateTurn(
    diceValue===6
    ?"6 आया — Token चुनें"
    :"Token चुनें"
  );
}

/* ---------------- MOVE ---------------- */

function moveToken(token){

  const roll=diceValue;

  if(!canMove(token,roll))return;

  /* Base -> starting cell */
  if(token.progress===-1){
    token.progress=0;
    token.state="active";
  }else{
    token.progress+=roll;
  }

  /* Exact finish */
  if(token.progress===78){
    token.finished=true;
    token.state="finished";
  }

  capture(token);

  drawTokens();

  diceValue=0;

  if(teamDone(players[currentPlayer].team)){
    showMessage(
      `🏆 TEAM ${players[currentPlayer].team+1} जीत गई!`
    );
    return;
  }

  if(roll===6){
    showMessage("6! फिर से चाल");
    setTimeout(()=>{
      hideMessage();
      updateTurn();
    },650);
  }else{
    nextTurn();
  }
}

/* ---------------- CAPTURE ---------------- */

function capture(moved){

  const pos=globalIndex(moved);

  if(pos===null)return;

  if(safe.includes(pos))return;

  tokens.forEach(other=>{

    if(other===moved)return;
    if(other.finished)return;
    if(other.progress<0 || other.progress>=72)return;

    if(players[other.player].team===players[moved.player].team)
      return;

    if(globalIndex(other)===pos){

      other.progress=-1;
      other.state="base";

      showMessage("⚡ कट गया!");
    }
  });
}

/* ---------------- TURN CHANGE ---------------- */

function nextTurn(){

  diceValue=0;

  currentPlayer=(currentPlayer+1)%6;

  updateTurn();
}

function updateTurn(custom){

  const p=players[currentPlayer];

  let text=custom || `${p.name} की बारी • Dice दबाएँ`;

  if(ownTokensDone(currentPlayer)){
    text+=` • Partner ${players[partners[currentPlayer]].name} unlocked`;
  }

  turnText.textContent=text;
}

/* ---------------- MESSAGE ---------------- */

let messageTimer;

function showMessage(text){

  msg.textContent=text;
  msg.classList.add("show");

  clearTimeout(messageTimer);

  messageTimer=setTimeout(()=>{
    hideMessage();
  },900);
}

function hideMessage(){
  msg.classList.remove("show");
}

/* ---------------- INITIAL DRAW ---------------- */

drawTokens();
updateTurn();

/* ---------------- DEBUG / RESET ---------------- */

window.BHAICHARA={
  players,
  tokens,
  reset(){
    tokens.forEach(t=>{
      t.state="base";
      t.progress=-1;
      t.finished=false;
    });

    currentPlayer=0;
    diceValue=0;
    setDice(1);
    drawTokens();
    updateTurn();
  }
};
</script>

</body>
</html>
